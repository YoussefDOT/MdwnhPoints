                                            </div>
                                            <span className="text-snow font-bold text-sm tracking-wide bg-darker/80 px-4 py-1.5 rounded-full group-hover:bg-saffron group-hover:text-darker transition-colors">
                                                {name}
                                            </span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Special 60 Points Cinematic Overlay */}
                    {special60.isActive && special60.phase !== 'loading' && (
                        <div className={`fixed inset-0 z-[1000] bg-black text-snow overflow-hidden flex flex-col items-center justify-center ${special60.phase === 'black1' || special60.phase === 'black2' || special60.phase === 'crown' || special60.phase === 'celebration' ? '' : 'animate-fade-in'}`}>
                            
                            {special60.phase === 'crown' && (
                                <div className="absolute inset-0 flex items-center justify-center bg-black">
                                    <div className="absolute inset-0">
                                        <img src="./Background.png" alt="" className="w-full h-full object-cover" />
                                    </div>
                                    <div className="relative z-10 animate-crown-snap">
                                        <img src="./Crown.png" alt="Crown" className="w-24 h-24 sm:w-28 sm:h-28 object-contain drop-shadow-[0_0_60px_rgba(244,200,43,0.6)]" />
                                    </div>
                                </div>
                            )}

                            {special60.phase === 'celebration' && (
                                <div className={`absolute inset-0 flex flex-col items-center justify-center bg-black/95 backdrop-blur-2xl animate-fade-in ${special60.cameraShake ? 'animate-camera-shake' : ''}`}>
                                    {/* Cinematic Background Avatar - 5% Opacity Quick Pan */}
                                    <div className="absolute inset-0 pointer-events-none overflow-hidden z-[-1] opacity-[0.05]"
                                        style={{
                                            WebkitMaskImage: 'radial-gradient(circle, black 30%, transparent 80%)',
                                            maskImage: 'radial-gradient(circle, black 30%, transparent 80%)'
                                        }}
                                    >
                                        <img
                                            src={avatarSrc(special60.user)}
                                            alt="Background Avatar"
                                            className="w-full h-full object-cover animate-pan-quick blur-sm"
                                        />
                                    </div>

                                    {/* Explosion Flash Overlay */}
                                    <div className="absolute inset-0 bg-white z-[1001] pointer-events-none animate-white-flash opacity-0"></div>

                                    <div className="absolute top-10 flex flex-col items-center animate-logo-in">
                                        <img
                                            src="./Logo.png"
                                            alt="Logo"
                                            className="w-24 sm:w-32 mb-4 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] invert brightness-200"
                                        />
                                    </div>

                                    <div className="flex flex-col items-center text-center px-6 animate-explosiveIn">
                                        <div className="w-40 h-40 sm:w-56 sm:h-56 mb-8 relative">
                                            {/* Brand Glow Backdrop - 200% Larger & More Transparent */}
                                            <div className="absolute inset-[-120px] rounded-full blur-[100px] opacity-40 animate-pulse"
                                                style={{
                                                    background: 'conic-gradient(#8a7ee2, #F4C82B, #8a7ee2, #086FB6, #8a7ee2)'
                                                }}
                                            ></div>

                                            {/* Falling Crown on Avatar */}
                                            {special60.showAvatarCrown && (
                                                <div className="absolute left-1/2 -translate-x-1/2 top-[-36%] w-[60%] z-20 animate-crown-fall">
                                                    <img src="./GoldCrown.png" alt="Crown" className="w-full h-auto object-contain drop-shadow-[0_0_50px_rgba(244,200,43,1)]" />
                                                </div>
                                            )}

                                            <div className="relative w-full h-full p-[6px] rounded-full overflow-hidden shadow-[0_0_40px_rgba(138,126,226,0.5)]">
                                                <div
                                                    className="absolute inset-0 animate-spinSlow"
                                                    style={{
                                                        background: 'conic-gradient(from 0deg, #8a7ee2, #F4C82B, #8a7ee2, #086FB6, #1FA8A1, #8a7ee2)',
                                                        backgroundSize: '200% 200%'
                                                    }}
                                                ></div>
                                                <div className="relative bg-darker rounded-full p-1 w-full h-full">
                                                    <div className="w-full h-full rounded-full overflow-hidden border-4 border-darker">
                                                        <img
                                                            src={avatarSrc(special60.user)}
                                                            alt={special60.user}
                                                            className="w-full h-full object-cover"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <h2 className="text-4xl sm:text-6xl font-black text-white mb-4 drop-shadow-lg animate-explosiveIn">نقطة ألماااسية!!!</h2>
                                        <p className="text-xl sm:text-2xl text-snow/90 mb-6 drop-shadow-md animate-[slideUpFade_1s_ease-out_0.2s_both]">جزيت خيرًا يا {getFirstName(special60.user)} 🤍</p>
                                    </div>

                                    {/* White Sparkles Overlay */}
                                    {showSparkles && (
                                        <div className="absolute inset-0 pointer-events-none overflow-hidden z-[1002]">
                                            {sparklePositions.map((sparkle, i) => (
                                                <div
                                                    key={i}
                                                    className="absolute animate-sparkle-up opacity-0"
                                                    style={{
                                                        top: `${sparkle.top}%`,
                                                        left: `${sparkle.left}%`,
                                                        animationDelay: `${sparkle.delay}s`,
                                                        animationDuration: `${sparkle.speed}s`
                                                    }}
                                                >
                                                    <svg className="w-5 h-5 sm:w-7 sm:h-7 fill-white drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]" viewBox="0 0 24 24" style={{ stroke: 'none' }}>
                                                        <path d="M12 2L10.5 8.5L4 10L10.5 11.5L12 18L13.5 11.5L20 10L13.5 8.5L12 2Z" />
                                                    </svg>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    
                                    {/* Continue Button */}
                                    {special60.showContinue && (
                                        <div className="absolute bottom-16 left-0 right-0 flex justify-center z-[1010] animate-fade-in" style={{ animationDuration: '1s' }}>
                                            <button
                                                onClick={() => {
                                                    setSpecial60(prev => ({ ...prev, phase: 'screenshot' }));
                                                    setShowSparkles(false);
                                                }}
                                                className="px-10 py-4 bg-[#8a7ee2] text-white rounded-full font-black text-xl shadow-[0_0_30px_rgba(138,126,226,0.6)] hover:scale-105 hover:bg-[#786dd1] transition-all"
                                            >
                                                متابعة
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Screenshot Screen (Like Wheel Result) */}
                            {special60.phase === 'screenshot' && (
                                <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md animate-explosiveIn p-4">
                                    <div className="glass-panel w-full max-w-sm p-8 text-center border-2 border-[#8a7ee2] shadow-[0_0_100px_rgba(138,126,226,0.3)]">
                                        <div className="w-32 h-32 rounded-full mx-auto mb-6 overflow-hidden border-4 border-[#8a7ee2]">
                                            <img src={avatarSrc(special60.user)} alt={special60.user} className="w-full h-full object-cover" />
                                        </div>
                                        <h3 className="text-4xl font-black mb-4 text-[#8a7ee2]">
                                            مبروووك! 🎉
                                        </h3>
                                        <div className="bg-darker p-6 rounded-2xl border border-snow/10 mb-8">
                                            <p className="text-2xl font-bold text-snow leading-relaxed">
                                                لقد حصلت على +60 نقطة!
                                            </p>
                                        </div>
                                        <p className="text-snow/50 text-sm mb-6 font-medium animate-pulse">قم بالتقاط الشاشة وارسلها للمشرف 📸</p>
                                        <button
                                            onClick={() => { setSpecial60({ isActive: false, phase: null, showContinue: false, user: null }); }}
                                            className="w-full py-4 rounded-xl font-black text-xl transition-all shadow-lg bg-[#8a7ee2] text-white hover:bg-[#786dd1]"
                                        >تم</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* صحبة الفجر — the round on THIS site is closed. The floating
                        «إضافة يومي» button, the member picker, the already-logged
                        warning, the daily log and the 4/4 popup were all write
                        surfaces, and every one of them is gone: the event runs in
                        the library now. What is left in the fajr tab is the record. */}

                    {/* ── Promotion Celebration Panel ── */}
                    {showPromotionModal && promotionNewTier && (
                        <div
                            className="fixed inset-0 z-[9999] flex items-center justify-center p-6"
                            style={{
                                background: promotionVisible ? 'rgba(0,0,0,0.72)' : 'rgba(0,0,0,0)',
                                backdropFilter: promotionVisible ? 'blur(8px)' : 'blur(0px)',
                                transition: 'background 0.4s ease, backdrop-filter 0.4s ease',
                            }}
                        >
                            <div
                                className="glass-panel w-full max-w-sm text-center relative overflow-hidden"
                                style={{
                                    borderColor: promotionNewTier.border,
                                    boxShadow: `0 24px 60px rgba(0,0,0,0.55)`,
                                    opacity: promotionVisible ? 1 : 0,
                                    transform: promotionVisible ? 'scale(1) translateY(0)' : 'scale(0.94) translateY(24px)',
                                    transition: 'opacity 0.45s ease, transform 0.45s cubic-bezier(0.34,1.56,0.64,1)',
                                }}
                            >
                                {/* Top accent wash in the tier color */}
                                <div className="absolute inset-x-0 top-0 h-40 pointer-events-none" style={{ background: `linear-gradient(to bottom, ${promotionNewTier.bg}, transparent)` }}></div>
                                <div className="absolute inset-x-0 top-0 h-1" style={{ background: promotionNewTier.color }}></div>

                                <div className="relative px-8 pt-8 pb-7">
                                    {/* Kicker */}
                                    <p className="text-xs font-black tracking-widest mb-5" style={{ color: promotionNewTier.color }}>★ ترقية جديدة ★</p>

                                    {/* Avatar with tier badge */}
                                    <div className="relative w-24 h-24 mx-auto mb-4">
                                        <div className="w-24 h-24 rounded-full overflow-hidden border-4" style={{ borderColor: promotionNewTier.color }}>
                                            <img src={avatarSrc(currentUser)} alt={currentUser} className="w-full h-full object-cover" onError={(e) => { e.target.src = AVATAR_FALLBACK; }} />
                                        </div>
                                        <div className="absolute -bottom-1 -left-1 w-10 h-10 rounded-full flex items-center justify-center text-xl border-2 border-darker" style={{ background: promotionNewTier.bg, borderColor: promotionNewTier.color }}>
                                            {promotionNewTier.emoji}
                                        </div>
                                    </div>

                                    {/* Headline */}
                                    <h3 className="text-3xl font-black text-snow mb-1">احسنتم!</h3>
                                    <p className="text-sm font-bold text-snow/55 mb-6">جزيتم خيرًا — تم ترقيتكم</p>

                                    {/* Tier name */}
                                    <p className="text-2xl font-black mb-4" style={{ color: promotionNewTier.color }}>
                                        {promotionNewTier.nameAr}
                                    </p>

                                    {/* Level progress dots */}
                                    <div className="flex items-center justify-center gap-2 mb-7" dir="ltr">
                                        {[1, 2, 3, 4, 5].map(n => (
                                            <span key={n} className="rounded-full transition-all" style={{
                                                width: n === promotionNewTier.level ? '28px' : '8px',
                                                height: '8px',
                                                background: n <= promotionNewTier.level ? promotionNewTier.color : 'rgba(250,249,247,0.15)'
                                            }}></span>
                                        ))}
                                    </div>

                                    {/* Screenshot note */}
                                    <p className="text-snow/45 text-xs font-medium mb-5">📸 قم بالتقاط الشاشة وارسالها في التوثيق</p>

                                    {/* Continue button */}
                                    <button
                                        onClick={() => { setPromotionVisible(false); setTimeout(() => setShowPromotionModal(false), 420); }}
                                        className="w-full py-3.5 rounded-full font-black text-lg text-darker transition-all hover:scale-[1.03] active:scale-95"
                                        style={{ background: promotionNewTier.color }}
                                    >
                                        متابعة
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* ===== مكتبة المدوّنة — claim a finished-task's points ===== */}
                    {(() => {
                        const claim = libraryClaims[0];
                        const show = claim && !isAddingPoints && !special60.isActive && celebration === null && !isPageSuckingIn && !showPromotionModal;
                        if (!show) return null;
                        const accent = claim.color || '#3bb9ab';
                        return (
                            <div className="fixed inset-0 z-[9998] flex items-center justify-center p-6" style={{ background: 'rgba(0,0,0,0.74)', backdropFilter: 'blur(8px)' }}>
                                <div className="glass-panel w-full max-w-sm text-center relative overflow-hidden" style={{ borderColor: accent, boxShadow: '0 24px 60px rgba(0,0,0,0.6)' }}>
                                    <div className="absolute inset-x-0 top-0 h-40 pointer-events-none" style={{ background: `linear-gradient(to bottom, ${accent}33, transparent)` }}></div>
                                    <div className="absolute inset-x-0 top-0 h-1" style={{ background: accent }}></div>
                                    <div className="relative px-8 pt-8 pb-7">
                                        <p className="text-xs font-black tracking-widest mb-4" style={{ color: accent }}>✦ مهمة مكتملة ✦</p>
                                        <div className="w-20 h-20 rounded-full overflow-hidden border-4 mx-auto mb-3" style={{ borderColor: accent }}>
                                            <img src={avatarSrc(currentUser)} alt={currentUser} className="w-full h-full object-cover" onError={(e) => { e.target.src = AVATAR_FALLBACK; }} />
                                        </div>
                                        <h3 className="text-2xl font-black text-snow mb-1">أحسنت، {getFirstName(currentUser)}!</h3>
                                        <p className="text-sm font-bold text-snow/55 mb-4">أتممت «{claim.title}»</p>
                                        <img src={`./points-stickers/${claim.points}.webp`} alt={`${claim.points} نقطة`} className="w-28 h-28 object-contain mx-auto mb-4" style={{ filter: 'drop-shadow(0 14px 26px rgba(0,0,0,0.5))' }} onError={(e) => { e.target.style.display = 'none'; }} />
                                        <p className="text-snow/70 text-sm font-bold mb-5">بانتظارك <span style={{ color: '#f4c82b' }}>+{claim.points}</span> نقطة</p>
                                        <button onClick={() => claimNow(claim)} disabled={claimBusy} className="w-full py-3.5 rounded-full font-black text-lg text-darker transition-all hover:scale-[1.03] active:scale-95 disabled:opacity-60" style={{ background: accent }}>
                                            {claimBusy ? '…' : 'استلم نقاطك'}
                                        </button>
                                        <button onClick={claimLater} className="w-full py-2.5 mt-2 rounded-full font-bold text-sm text-snow/60 hover:text-snow transition-colors">لاحقًا</button>
                                        {libraryClaims.length > 1 && <p className="text-snow/40 text-xs font-bold mt-3">ولديك {libraryClaims.length - 1} أخرى بعدها</p>}
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        // Pull the shared roster first so avatars resolve to the central repo (with local
        // fallback). Never block the app on it — render even if the fetch fails.
        fetch(`${ROSTER_BASE}/members.json`, { cache: 'no-cache' })
            .then(r => { if (!r.ok) throw 0; return r.json(); })
            .then(data => {
                data.members.forEach(m => {
                    if (m.dummy) return;
                    SLUG_BY_KEY[m.dbKey] = m.slug;
                    NAME_BY_SLUG[m.slug] = m.dbKey;
                });
            })
            .catch(() => {})
            .finally(() => root.render(<App />));
    </script>

    <!-- Failsafe watchdog: if the app never renders (e.g. an in-browser compile/runtime error),
         show a visible message instead of a silent blank page. -->
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                var root = document.getElementById('root');
                if (root && root.children.length === 0) {
                    console.error('[failsafe] App did not render within 6s — #root is empty. Check the browser console for a compile/runtime error.');
                    root.innerHTML =
                        '<div dir="rtl" style="max-width:480px;margin:80px auto;padding:32px;text-align:center;font-family:sans-serif;color:#f3f3f3;background:rgba(0,0,0,0.45);border-radius:18px;">' +
                        '<h2 style="font-size:22px;margin:0 0 12px;">تعذّر تحميل الصفحة</h2>' +
                        '<p style="font-size:15px;opacity:.85;margin:0 0 20px;">حدث خطأ أثناء التحميل. جرّب تحديث الصفحة.</p>' +
                        '<button onclick="location.reload()" style="background:#e7b53b;color:#1a1a1a;border:none;border-radius:999px;padding:10px 28px;font-size:15px;font-weight:700;cursor:pointer;">تحديث الصفحة</button>' +
                        '</div>';
                }
            }, 6000);
        });
    </script>
</body>
