    <style>
        .cubic-bezier-wheel {
            transition-timing-function: cubic-bezier(0.15, 0, 0.1, 1) !important;
        }

        .vertical-text {

            transform-origin: center;
            white-space: nowrap;
            max-width: 150px;
        }

    <!-- ============ صحبة الفجر (Sabha Fajr) feature styles ============ -->
    <style>
        :root {
            --sabha-blue: #7EB8D4;
            --sabha-blue-soft: #9fd0e6;
            --sabha-blue-deep: #4f8fb0;
            --sabha-ink: #0c1a24;
            --sabha-green: #3bb9ab;
            --sabha-yellow: #f4c82b;
            --sabha-pink: #E8A0BF;
            --sabha-pink-soft: #f0c4d8;
            --sabha-pink-deep: #C96EA0;
        }

        /* ---- Background cross-fade layers ---- */
        .sabha-bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            transition: opacity 1.1s ease;
        }
        .sabha-bg-points { background-image: url('./BG.jpg'); }
        /* Sabha Fajr tab: solid deep-blue — covers the animated blobs entirely */
        .sabha-bg-fajr { background: #0b1824; }
        /* Female overlay: fades in on top of the blue base to give a vibrant pink tint */
        .sabha-bg-female {
            background:
                radial-gradient(120% 70% at 50% 0%, rgba(232, 100, 170, 0.35), transparent 60%),
                radial-gradient(80% 50% at 80% 80%, rgba(201, 110, 160, 0.18), transparent 55%),
                linear-gradient(180deg, #250d1e 0%, #180b16 45%, #0f060d 100%);
        }

        /* ---- Main tab bar ---- */
        .sabha-tabbar {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px;
            border-radius: 999px;
            background: rgba(18, 18, 22, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }
        .sabha-tab {
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            padding: 11px 28px;
            border: none;
            background: transparent;
            color: rgba(250, 249, 247, 0.55);
            border-radius: 999px;
            cursor: pointer;
            transition: color .3s ease, background .45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow .45s ease, transform .2s ease;
        }
        .sabha-tab:hover { color: rgba(250, 249, 247, 0.9); }
        .sabha-tab:active { transform: scale(0.95); }
        .sabha-tab.points.is-active {
            color: #1a1a1a;
            background: var(--sabha-yellow);
            box-shadow: 0 0 24px rgba(244, 200, 43, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        .sabha-tab.fajr.is-active {
            color: var(--sabha-ink);
            background: var(--sabha-blue);
            box-shadow: 0 0 26px rgba(126, 184, 212, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
            transition: background .45s ease, box-shadow .45s ease, color .45s ease;
        }
        .sabha-tab.fajr.is-active.female {
            background: var(--sabha-pink);
            box-shadow: 0 0 26px rgba(232, 160, 191, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        /* ---- Fajr panel header ---- */
        .sabha-fajr-title {
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: var(--sabha-blue);
            text-shadow: 0 0 22px rgba(126, 184, 212, 0.45);
            margin-bottom: 4px;
            text-align: center;
            transition: color .45s ease, text-shadow .45s ease;
        }
        .sabha-fajr-title.female {
            color: var(--sabha-pink);
            text-shadow: 0 0 22px rgba(232, 160, 191, 0.45);
        }
        .sabha-fajr-sub {
            color: rgba(250, 249, 247, 0.55);
            font-size: 0.9rem;
            margin-bottom: 22px;
            text-align: center;
        }

        /* ---- Sub-tabs (الإخوة / الأخوات) ---- */
        .sabha-subtabs {
            display: inline-flex;
            gap: 6px;
            padding: 5px;
            border-radius: 999px;
            background: rgba(126, 184, 212, 0.07);
            border: 1px solid rgba(126, 184, 212, 0.18);
            margin-bottom: 26px;
        }
        .sabha-subtab {
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 22px;
            border: none;
            background: transparent;
            color: rgba(250, 249, 247, 0.5);
            border-radius: 999px;
            cursor: pointer;
            transition: all .35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .sabha-subtab:hover { color: rgba(250, 249, 247, 0.85); }
        .sabha-subtab.is-active {
            color: var(--sabha-ink);
            background: var(--sabha-blue);
            box-shadow: 0 0 18px rgba(126, 184, 212, 0.5);
        }
        .sabha-subtab.is-active.female {
            background: var(--sabha-pink);
            box-shadow: 0 0 18px rgba(232, 160, 191, 0.55);
        }

        /* ---- Gender switch animation ---- */
        @keyframes sabhaGenderIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .sabha-gender-list { animation: sabhaGenderIn .35s cubic-bezier(0.22, 1, 0.36, 1); }

        /* ---- Week navigation slide ---- */

        /* ---- Leaderboard ---- */
        .sabha-board { width: 100%; max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; min-height: 60vh; }

        .sabha-empty { text-align: center; color: rgba(250, 249, 247, 0.5); font-weight: 700; padding: 40px 0; }

        .sabha-board-inner { width: 100%; max-width: 1300px; margin: 0 auto; }

        /* ============ صحبة الفجر — النتائج (the closed round) ============
           The event moved to the library; this is the record it left behind.
           Everything here is read-only by construction: there is no control in
           the markup that writes, so "locked" is not a flag anybody can flip. */
        .sbr-moved {
            display: inline-flex; align-items: center; gap: 8px;
            margin: -10px 0 22px; padding: 10px 20px; border-radius: 999px;
            font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 0.86rem;
            color: var(--sabha-ink); text-decoration: none;
            background: linear-gradient(135deg, var(--sabha-blue-soft), var(--sabha-blue));
            box-shadow: 0 10px 30px rgba(126, 184, 212, 0.4);
            transition: transform .25s ease, box-shadow .3s ease;
        }
        .sbr-moved:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(126, 184, 212, 0.55); }

        /* ---- the podium: second, FIRST, third ---- */
        .sbr-podium {
            display: flex; align-items: flex-end; justify-content: center;
            gap: 14px; margin-bottom: 26px; flex-wrap: nowrap;
        }
        .sbr-p {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            flex: 0 1 auto; min-width: 0; padding: 16px 12px 14px;
            border-radius: 24px;
            background: rgba(26, 26, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .sbr-p.place-1 {
            padding: 22px 18px 18px;
            border-color: rgba(244, 200, 43, 0.45);
            background: linear-gradient(160deg, rgba(244, 200, 43, 0.14), rgba(26, 26, 30, 0.7));
            box-shadow: 0 0 34px rgba(244, 200, 43, 0.22);
        }
        .sbr-p.is-me { outline: 2px solid var(--sabha-blue); outline-offset: 2px; }
        .sbr-crown { font-size: 1.3rem; line-height: 1; }
        .sbr-p.place-1 .sbr-crown { font-size: 1.9rem; }
        .sbr-p-av {
            width: 68px; height: 68px; border-radius: 50%; overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.12); background: #262626;
        }
        .sbr-p.place-1 .sbr-p-av { width: 96px; height: 96px; border-color: #f4c82b; box-shadow: 0 0 26px rgba(244, 200, 43, 0.45); }
        .sbr-p-av img { width: 100%; height: 100%; object-fit: cover; }
        .sbr-p-name { font-weight: 800; font-size: 0.86rem; color: #faf9f7; text-align: center; }
        .sbr-p.place-1 .sbr-p-name { font-size: 1.05rem; font-weight: 900; }
        .sbr-p-pts { font-weight: 900; font-size: 1.35rem; color: var(--sabha-blue); text-shadow: 0 0 14px rgba(126, 184, 212, 0.4); }
        .sbr-p.place-1 .sbr-p-pts { font-size: 1.85rem; color: #f4c82b; text-shadow: 0 0 18px rgba(244, 200, 43, 0.5); }
        .sbr-p-days { font-size: 0.68rem; font-weight: 700; color: rgba(250, 249, 247, 0.45); }
        .sabha-board.females .sbr-p-pts { color: var(--sabha-pink); }
        .sabha-board.females .sbr-p.place-1 .sbr-p-pts { color: #f4c82b; }

        /* ---- everyone else who submitted ---- */
        .sbr-list { display: flex; flex-direction: column; gap: 8px; }
        .sbr-row {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 18px;
            background: rgba(26, 26, 30, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .sbr-row.is-me { border-color: rgba(126, 184, 212, 0.5); background: linear-gradient(120deg, rgba(126, 184, 212, 0.14), rgba(26, 26, 30, 0.65)); }
        .sabha-board.females .sbr-row.is-me { border-color: rgba(232, 160, 191, 0.55); background: linear-gradient(120deg, rgba(232, 160, 191, 0.14), rgba(26, 26, 30, 0.65)); }
        .sbr-rank { flex: 0 0 auto; min-width: 20px; text-align: center; font-weight: 900; font-size: 0.8rem; color: rgba(250, 249, 247, 0.35); }
        .sbr-av { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.1); background: #262626; }
        .sbr-av img { width: 100%; height: 100%; object-fit: cover; }
        .sbr-who { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
        .sbr-who b { font-size: 0.9rem; font-weight: 800; color: #faf9f7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sbr-who span { font-size: 0.68rem; font-weight: 700; color: rgba(250, 249, 247, 0.45); }
        .sbr-pts { flex: 0 0 auto; font-weight: 900; font-size: 1.15rem; color: var(--sabha-blue); }
        .sabha-board.females .sbr-pts { color: var(--sabha-pink); }

        /* ---- الإخوة × الأخوات ---- */
        .sbr-vs { margin-top: 26px; }
        .sbr-vs-hd { text-align: center; font-weight: 900; font-size: 1rem; color: #faf9f7; margin-bottom: 14px; }
        .sbr-vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .sbr-vs-side {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            padding: 18px 12px; border-radius: 22px;
            background: rgba(126, 184, 212, 0.07);
            border: 2px solid rgba(126, 184, 212, 0.18);
        }
        .sbr-vs-side.pink { background: rgba(232, 160, 191, 0.07); border-color: rgba(232, 160, 191, 0.2); }
        .sbr-vs-side.win { border-color: var(--sabha-blue); box-shadow: 0 0 28px rgba(126, 184, 212, 0.3); }
        .sbr-vs-side.pink.win { border-color: var(--sabha-pink); box-shadow: 0 0 28px rgba(232, 160, 191, 0.32); }
        .sbr-vs-nm { font-weight: 900; font-size: 0.92rem; color: #faf9f7; }
        .sbr-vs-big { font-weight: 900; font-size: 2rem; line-height: 1.1; color: var(--sabha-blue); }
        .sbr-vs-side.pink .sbr-vs-big { color: var(--sabha-pink); }
        .sbr-vs-lb { font-size: 0.68rem; font-weight: 700; color: rgba(250, 249, 247, 0.5); }
        .sbr-vs-sm { font-size: 0.66rem; font-weight: 700; color: rgba(250, 249, 247, 0.35); margin-top: 4px; }
        .sbr-vs-ft { text-align: center; margin-top: 12px; font-size: 0.78rem; font-weight: 700; color: rgba(250, 249, 247, 0.5); }

        /* ---- أرقام الجولة ---- */
        .sbr-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 22px; }
        .sbr-stat {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 14px 8px; border-radius: 18px; text-align: center;
            background: rgba(26, 26, 30, 0.55); border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .sbr-stat b { font-weight: 900; font-size: 1.3rem; color: var(--sabha-blue); }
        .sbr-stat span { font-size: 0.66rem; font-weight: 700; color: rgba(250, 249, 247, 0.45); }
        .sbr-stat.wide { grid-column: span 2; }
        .sbr-stat.wide b { font-size: 0.98rem; color: #faf9f7; }
        .sabha-board.females .sbr-stat b { color: var(--sabha-pink); }
        .sabha-board.females .sbr-stat.wide b { color: #faf9f7; }

        @media (max-width: 520px) {
            .sabha-tab { padding: 10px 16px; font-size: 13px; }

            .sbr-podium { gap: 7px; }
            .sbr-p { padding: 12px 7px 10px; border-radius: 18px; }
            .sbr-p.place-1 { padding: 16px 10px 12px; }
            .sbr-p-av { width: 52px; height: 52px; }
            .sbr-p.place-1 .sbr-p-av { width: 72px; height: 72px; }
            .sbr-p-name { font-size: 0.72rem; }
            .sbr-p.place-1 .sbr-p-name { font-size: 0.85rem; }
            .sbr-p-pts { font-size: 1.1rem; }
            .sbr-p.place-1 .sbr-p-pts { font-size: 1.5rem; }
            .sbr-stats { grid-template-columns: repeat(2, 1fr); }
            .sbr-stat.wide { grid-column: span 2; }
            .sbr-vs-big { font-size: 1.6rem; }
        }
    </style>
</head>

        // by this one set, which is also what the library keys `gender` on.
        const SABHA_FEMALE_SET = ["سحاب", "شفق", "منة", "ملك", "ورقاء", "نجود", "جمانة"];

        const AVATAR_FALLBACK = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23262626" width="100" height="100"/><text x="50" y="55" font-family="sans-serif" font-size="40" text-anchor="middle" fill="%23faf9f7">?</text></svg>';
        // Bump this whenever avatar files change so installed PWAs (which cache images more
        // aggressively than a plain browser tab) fetch the new file instead of a stale copy.
        const AVATAR_V = 2;
        // Shared team roster — single source of truth (github.com/mdwnstudio/MdwnhMembers).
        // SLUG_BY_KEY maps a DB key (Arabic name) -> ASCII avatar slug; filled from members.json
        // before render. Empty until then, so avatars fall back to the bundled local files.
        const ROSTER_BASE = 'https://raw.githubusercontent.com/mdwnstudio/MdwnhMembers/main';
        const SLUG_BY_KEY = {};   // "الشعيرة" -> "al-shaeera"
        const NAME_BY_SLUG = {};  // "al-shaeera" -> "الشعيرة"
        const avatarSrc = (name) => SLUG_BY_KEY[name]
            ? `${ROSTER_BASE}/avatars/${SLUG_BY_KEY[name]}.png`
            : `./MdwnhMembers/${name}.png?v=${AVATAR_V}`;
        // Layered avatar fallback (remote roster -> bundled local -> placeholder), applied to
        // every <img> at once. Runs in the document capture phase, ahead of React's own onError,
        // so we own the fallback chain.
        document.addEventListener('error', function (e) {
            const img = e.target;
            if (!img || img.tagName !== 'IMG') return;
            const src = String(img.src);
            if (src.indexOf(ROSTER_BASE) === 0) {
                e.stopPropagation();
                const slug = src.slice(src.lastIndexOf('/') + 1).replace(/\.png.*$/, '');
                const name = NAME_BY_SLUG[slug] || decodeURIComponent(slug);
                img.src = `./MdwnhMembers/${name}.png?v=${AVATAR_V}`;
            } else if (src.indexOf('/MdwnhMembers/') !== -1) {
                e.stopPropagation();
                img.onerror = null;
                img.src = AVATAR_FALLBACK;
            }
        }, true);

        const toArabicNum = (n) => String(n).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

        // The daily-log screen and its 4/4 popup used to live here. صحبة الفجر
        // moved to the LIBRARY (mdwnstudio.github.io/MdwnhLibrary) — logging a
        // day there is two taps from the task list instead of a second site and
        // a password, which is the whole reason nobody was logging days here.
        // This page keeps the DATA and shows the result; it no longer writes to
        // sabha_fajr at all. See git history for the removed components.

        function App() {
            const [db, setDb] = useState(null);
            const [dbError, setDbError] = useState(null);

            useEffect(() => {
                const initFb = () => {
                    if (window.firebaseModular && !db) {
                        try {
                            const { initializeApp, getApp, getApps, getDatabase } = window.firebaseModular;
                            const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
                            setDb(getDatabase(app));
                        } catch (e) {
                            setDbError(e.message);
                        }
                    }
                };
                if (window.firebaseModular) initFb();
                else window.addEventListener('firebaseReady', initFb);
                return () => window.removeEventListener('firebaseReady', initFb);
            }, [db]);

            if (dbError) {
                return <div className="p-10 text-center text-carmine font-bold text-xl">حدث خطأ: {dbError}</div>;
            }

            if (!db) {
                return (
                    <div className="flex h-screen items-center justify-center">
                        <div className="loader !w-16 !h-16 !border-4 !border-spanish"></div>
                    </div>
                );
            }
            return <Game db={db} />;
        }

        function Game({ db }) {
            const { ref, onValue, set, get, push, remove, serverTimestamp } = window.firebaseModular;

            const [currentUser, setCurrentUser] = useState(null);
            const [targetUser, setTargetUser] = useState(null);
            const [players, setPlayers] = useState([]);

            const [isAddingPoints, setIsAddingPoints] = useState(false);
            const [addingPointsLabel, setAddingPointsLabel] = useState(null);
            const [manualTargetPoints, setManualTargetPoints] = useState("");
            const [achievementNote, setAchievementNote] = useState("");
            const [historyLogs, setHistoryLogs] = useState([]);

            const [showJournalModal, setShowJournalModal] = useState(false);
            const [journalNote, setJournalNote] = useState("");
            const [journalDate, setJournalDate] = useState("");
            const [isAddingJournal, setIsAddingJournal] = useState(false);
            const [editingJournalId, setEditingJournalId] = useState(null);

            // Lucky Wheel State
            const [showWheelModal, setShowWheelModal] = useState(false);
            const [activeWheelType, setActiveWheelType] = useState(null); // 'PUNISHMENT' | 'REWARD' | null
            const [wheelSpinning, setWheelSpinning] = useState(false);
            const [wheelRotation, setWheelRotation] = useState(0);
            const [wheelResult, setWheelResult] = useState(null);
            const [showWheelResultOverlay, setShowWheelResultOverlay] = useState(false);
            const [isAudioLoading, setIsAudioLoading] = useState(false);
            const wheelAudioRef = useRef(null);

            // Edit popup state
            const [editPopup, setEditPopup] = useState(null); // { log } or null
            const [editPopupNote, setEditPopupNote] = useState("");
            const [editPopupDate, setEditPopupDate] = useState("");
            const [isEditSaving, setIsEditSaving] = useState(false);

            // Custom date picker state
            const [showDatePicker, setShowDatePicker] = useState(false);
            const [datePickerTarget, setDatePickerTarget] = useState(null); // 'main' or 'edit'
            const [pickerMonth, setPickerMonth] = useState(new Date().getMonth());
            const [pickerYear, setPickerYear] = useState(new Date().getFullYear());

            // Member password system
            const [pendingUser, setPendingUser] = useState(null);
            const [memberPasswordMode, setMemberPasswordMode] = useState(null); // 'set' | 'enter'
            const [memberPasswordInput, setMemberPasswordInput] = useState("");
            const [memberPasswordError, setMemberPasswordError] = useState("");
            const [isMemberPasswordLoading, setIsMemberPasswordLoading] = useState(false);

            // Helper to handle Arabic numerals during data entry
            const arabicToLatin = (str) => {
                const map = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };
                return String(str).replace(/[٠-٩]/g, (mat) => map[mat]);
            };
            const [historyFilterUser, setHistoryFilterUser] = useState("ALL");
            const [historySettings, setHistorySettings] = useState({ showLogs: true, showPunishments: true, showRewards: true, showManualPoints: true });

            const [globalPasswordsEnabled, setGlobalPasswordsEnabled] = useState(true);
            const [showMemberSelectOverlay, setShowMemberSelectOverlay] = useState(null); // 'history' or 'target'

            const [celebration, setCelebration] = useState(null);
            const [isCelebrationClosing, setIsCelebrationClosing] = useState(false);
            const [showSparkles, setShowSparkles] = useState(false);
            const [sparklePositions, setSparklePositions] = useState([]);
            const [isPageSuckingIn, setIsPageSuckingIn] = useState(false);
            const [pointsPopAnim, setPointsPopAnim] = useState(false);

            const [special60, setSpecial60] = useState({ isActive: false, phase: null, showContinue: false, user: null });
            const [toast, setToast] = useState(null); // { message, visible }
            const [dbError, setDbError] = useState(null);

            const [adminMode, setAdminMode] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [showPasswordPrompt, setShowPasswordPrompt] = useState(false);

            // صحبة الفجر state
            const [sabhaData, setSabhaData] = useState({});
            const [leaderboardView, setLeaderboardView] = useState('tier'); // 'tier' | 'all'
            const [viewedTier, setViewedTier] = useState(null); // null = user's own tier
            // Which slice of the closed round the results view is showing.
            // Three, not two: «الكل» is the one ranking that answers "who won
            // صحبة الفجر", and the two gender tabs are what the members
            // actually compare themselves inside.
            const [sabhaTab, setSabhaTab] = useState('all'); // 'all' | 'males' | 'females'
            const [sabhaMe, setSabhaMe] = useState(null);
            const [userTab, setUserTab] = useState('points'); // 'points' | 'fajr'
            const prevUserTierRef = useRef(null);
            const prevUserPointsRef = useRef(null);
            const prevUserNameRef = useRef(null);

            const [showPromotionModal, setShowPromotionModal] = useState(false);
            const [promotionNewTier, setPromotionNewTier] = useState(null);
            const [promotionVisible, setPromotionVisible] = useState(false); // CSS transition trigger
            const [pendingPromotion, setPendingPromotion] = useState(null); // queued until anim done

            // ---- مكتبة المدوّنة task claims (points earned by finishing a Library task) ----
            const [libraryClaims, setLibraryClaims] = useState([]); // [{taskId,title,points,color,_key}]
            const [claimBusy, setClaimBusy] = useState(false);

            // Match a name coming from the Library (URL / DB key) to a real login member.
            // Robust to diacritics (أُبي) and hamza/alef spelling (أبو بندر, ابو مزاحم).
            const resolveMemberName = (raw) => {
                if (!raw) return null;
                let dec = raw; try { dec = decodeURIComponent(raw); } catch (e) {}
                const norm = (s) => (s || '').normalize('NFC').replace(/\s+/g, ' ').trim();
                const loose = (s) => norm(s).normalize('NFD')
                    .replace(/[ً-ٰٟ]/g, '')   // strip harakat + superscript alef
                    .replace(/[آأإ]/g, 'ا') // آأإ -> ا
                    .replace(/ى/g, 'ي')              // ى -> ي
                    .replace(/ة/g, 'ه');             // ة -> ه
                const target = norm(dec);
                let hit = LOGIN_MEMBERS.find((m) => norm(m) === target);
                if (hit) return hit;
                const lt = loose(dec);
                hit = LOGIN_MEMBERS.find((m) => loose(m) === lt);
                return hit || null;
            };

            useEffect(() => {
                const playersRef = ref(db, 'players');
                const unsubscribe = onValue(playersRef, (snapshot) => {
                    setDbError(null);
                    const data = snapshot.val() || {};
                    const parsedPlayers = Object.entries(data)
                        .filter(([name]) => name !== "سراج" && name !== "نواف")
                        .map(([name, info]) => ({
                        name,
                        points: info.totalPoints || 0
                    })).sort((a, b) => b.points - a.points);
                    setPlayers(parsedPlayers);
                }, (error) => {
                    setDbError(error.message);
                });

                const historyRef = ref(db, 'history');
                const hUnsubscribe = onValue(historyRef, (snapshot) => {
                    const data = snapshot.val() || {};
                    const parsedHistory = Object.entries(data).map(([id, info]) => ({
                        id,
                        ...info
                    })).sort((a, b) => b.timestamp - a.timestamp);
                    setHistoryLogs(parsedHistory);
                });

                const settingsRef = ref(db, 'settings/passwordsEnabled');
                const sUnsubscribe = onValue(settingsRef, (snapshot) => {
                    const val = snapshot.val();
                    setGlobalPasswordsEnabled(val === null ? true : val);
                });

                // صحبة الفجر — live-synced daily log data (separate from players/history)
                const sabhaRef = ref(db, 'sabha_fajr');
                const sabUnsubscribe = onValue(sabhaRef, (snapshot) => {
                    const data = snapshot.val() || {};
                    if (data["سراج"]) delete data["سراج"]; // never surface the test user
                    setSabhaData(data);
                });

                return () => { unsubscribe(); hUnsubscribe(); sUnsubscribe(); sabUnsubscribe(); };
            }, [db]);

            // Restore saved login on mount (skip password re-entry since already authenticated)
            useEffect(() => {
                const saved = localStorage.getItem("mdwnh_user");
                if (saved && LOGIN_MEMBERS.includes(saved)) {
                    setCurrentUser(saved);
                    setSabhaMe(saved);
                    if (saved === "نواف") setUserTab('fajr');
                } else {
                    const savedMe = localStorage.getItem("sabha_me");
                    if (savedMe) setSabhaMe(savedMe);
                }
            }, []);

            // Arriving from the Library with ?user=<name>&claim=1 — log the member in
            // automatically (the Library already authenticated them) so they land on
            // their own points page, then clean the URL so a refresh won't re-fire.
            useEffect(() => {
                if (!db) return;
                let params; try { params = new URLSearchParams(window.location.search); } catch (e) { return; }
                const rawUser = params.get('user');
                const wantsClaim = params.has('claim');
                if (rawUser && !localStorage.getItem("mdwnh_user")) {
                    const resolved = resolveMemberName(rawUser);
                    if (resolved) {
                        finishMemberLogin(resolved); // bypasses the member password on purpose
                    } else {
                        try { showToast('لم نتعرّف على اسمك تلقائيًا — اختر اسمك للمتابعة واستلام نقاطك'); } catch (e) {}
                    }
                }
                if ((rawUser || wantsClaim) && window.history && window.history.replaceState) {
                    window.history.replaceState({}, '', window.location.pathname);
                }
            }, [db]);

            // Pull pending Library task-claims for whoever is logged in (works whether they
            // just auto-logged-in from a claim link or opened the site normally).
            useEffect(() => {
                if (!db || !currentUser) { setLibraryClaims([]); return; }
                let cancelled = false;
                const claimKey = (() => { try { return currentUser.normalize('NFC'); } catch (e) { return currentUser; } })();
                (async () => {
                    try {
                        const snap = await get(ref(db, 'mdwnhLibrary/claims/' + claimKey));
                        if (cancelled) return;
                        const val = snap.exists() ? snap.val() : null;
                        if (!val) { setLibraryClaims([]); return; }
                        const list = Object.keys(val).map((k) => ({ ...val[k], _key: k, taskId: (val[k] && val[k].taskId) || k }));
                        list.sort((a, b) => (a.ts || 0) - (b.ts || 0));
                        setLibraryClaims(list);
                    } catch (e) { if (!cancelled) console.warn('[claim] read failed', e); }
                })();
                return () => { cancelled = true; };
            }, [db, currentUser]);

            // Settle one claim: delete it first (so a replay can't double-award), then run
            // the normal point-award sequence for its sticker value.
            const claimNow = async (claim) => {
                if (claimBusy || !claim) return;
                setClaimBusy(true);
                const key = claim._key || claim.taskId;
                const ck = (() => { try { return currentUser.normalize('NFC'); } catch (e) { return currentUser; } })();
                try { await remove(ref(db, 'mdwnhLibrary/claims/' + ck + '/' + key)); }
                catch (e) { console.warn('[claim] remove failed', e); }
                setLibraryClaims((prev) => prev.filter((c) => (c._key || c.taskId) !== key));
                setClaimBusy(false);
                // Pass the title straight through instead of via setAchievementNote: that
                // state update is async, so addPoints (called on the very next line, same
                // tick) would still see the pre-update value and log an empty note.
                addPoints(Number(claim.points) || 0, { note: claim.title || '' });
            };
            const claimLater = () => setLibraryClaims([]);

            // Promotion detection: queue a pending promotion but don't show yet
            useEffect(() => {
                if (!currentUser || players.length === 0) return;
                const idx = players.findIndex(p => p.name === currentUser);
                if (idx === -1) return;
                const newTier = Math.max(1, 5 - Math.floor(idx / 5));
                const myPoints = players[idx].points ?? 0;
                // A different user just logged in — reset the baseline, never compare across users.
                if (prevUserNameRef.current !== currentUser) {
                    prevUserNameRef.current = currentUser;
                    prevUserTierRef.current = newTier;
                    prevUserPointsRef.current = myPoints;
                    return;
                }
                // Only celebrate a real promotion: tier went up AND the user's OWN points increased.
                // Relative tiers can shift on the first data snapshot (partial/unsorted load) or when
                // others' points change — those must never fire the card on a plain page open.
                const tierWentUp = prevUserTierRef.current !== null && newTier > prevUserTierRef.current;
                const pointsWentUp = prevUserPointsRef.current !== null && myPoints > prevUserPointsRef.current;
                if (tierWentUp && pointsWentUp) {
                    setPendingPromotion(TIER_CONFIG[newTier - 1]);
                }
                prevUserTierRef.current = newTier;
                prevUserPointsRef.current = myPoints;
            }, [players, currentUser]);

            // Fire queued promotion once all point-award animations have finished.
            // Guards use ALL four signals so the effect re-runs whenever any of them clears:
            //  - celebration: set 700ms *inside* triggerCelebration timeout, so use isPageSuckingIn
            //    (set synchronously in triggerCelebration) as the early sentinel
            //  - special60.isActive: covers the entire 60+ cinematic
            //  - isAddingPoints: covers 5/10/20 and the 30+ finally-block 3 s wait
            //  - isPageSuckingIn: set synchronously before celebration, covers the 700 ms gap
            useEffect(() => {
                if (!pendingPromotion) return;
                if (celebration !== null || special60.isActive || isPageSuckingIn || isAddingPoints) return;
                const tc = pendingPromotion;
                const timer = setTimeout(() => {
                    setPromotionNewTier(tc);
                    setShowPromotionModal(true);
                    setViewedTier(tc.level);
                    setLeaderboardView('tier');
                    setPendingPromotion(null);
                    try { new Audio('./sounds/Promotion.mp3').play(); } catch(e) {}
                    // Two rAF frames guarantee the element has painted at opacity:0 before transition
                    requestAnimationFrame(() => requestAnimationFrame(() => setPromotionVisible(true)));
                    setTimeout(() => {
                        if (window.confetti) {
                            window.confetti({ particleCount: 220, spread: 110, origin: { y: 0.55 }, colors: [tc.color, '#fff', '#1fa8a1', '#f4c82b'] });
                            setTimeout(() => window.confetti({ particleCount: 130, spread: 75, origin: { y: 0.4 }, colors: [tc.color, '#fff'] }), 650);
                        }
                    }, 200);
                }, 2000);
                return () => clearTimeout(timer);
            }, [pendingPromotion, celebration, special60.isActive, isPageSuckingIn, isAddingPoints]);

            // Reset scroll to top when changing "pages" (user/admin login/logout)
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [currentUser, adminMode, showPasswordPrompt]);

            // Member password system
            const selectUser = async (name) => {
                if (!globalPasswordsEnabled) {
                    finishMemberLogin(name);
                    return;
                }
                
                setIsMemberPasswordLoading(true);
                setPendingUser(name);
                try {
                    // Always read fresh from Firebase - never use cached data
                    const playerRef = ref(db, `players/${name}/password`);
                    const snap = await get(playerRef);
                    if (snap.exists() && snap.val()) {
                        setMemberPasswordMode('enter');
                    } else {
                        setMemberPasswordMode('set');
                    }
                } catch (e) {
                    setMemberPasswordMode('set');
                } finally {
                    setIsMemberPasswordLoading(false);
                    setMemberPasswordInput("");
                    setMemberPasswordError("");
                }
            };

            const finishMemberLogin = (name) => {
                setCurrentUser(name);
                setSabhaMe(name);
                if (name === "نواف") setUserTab('fajr');
                try { localStorage.setItem('sabha_me', name); } catch(e) {}
                localStorage.setItem("mdwnh_user", name);
                setPendingUser(null);
                setMemberPasswordMode(null);
                setMemberPasswordInput("");
                setMemberPasswordError("");
            };

            const handleMemberPassword = async (e) => {
                e.preventDefault();
                if (!memberPasswordInput.trim()) return;
                setIsMemberPasswordLoading(true);
                try {
                    // Always read fresh - ensures manual Firebase changes work immediately
                    const playerRef = ref(db, `players/${pendingUser}/password`);
                    if (memberPasswordMode === 'set') {
                        await set(playerRef, memberPasswordInput.trim());
                        finishMemberLogin(pendingUser);
                    } else {
                        const snap = await get(playerRef);
                        const storedPw = snap.val();
                        if (storedPw && storedPw === memberPasswordInput.trim()) {
                            finishMemberLogin(pendingUser);
                        } else {
                            setMemberPasswordError("كلمة المرور غير صحيحة. حاول مرة أخرى.");
                        }
                    }
                } catch (err) {
                    setMemberPasswordError("حدث خطأ. حاول مرة أخرى.");
                } finally {
                    setIsMemberPasswordLoading(false);
                }
            };

            const showToast = (message) => {
                setToast({ message, visible: true });
                setTimeout(() => {
                    setToast(prev => prev ? { ...prev, visible: false } : null);
                    setTimeout(() => setToast(null), 400);
                }, 3000);
            };

            const toggleHistorySetting = (key) => {
                setHistorySettings(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const togglePasswordsEnabled = async () => {
                const newVal = !globalPasswordsEnabled;
                setGlobalPasswordsEnabled(newVal); // Optimistic update
                if (adminMode) {
                    try {
                        const settingsRef = ref(db, 'settings/passwordsEnabled');
                        await set(settingsRef, newVal);
                    } catch (e) {
                        console.error("Failed to sync password settings:", e);
                        setGlobalPasswordsEnabled(!newVal); // Revert on fail
                    }
                }
            };

            const logout = () => {
                setCurrentUser(null);
                setAdminMode(false);
                setTargetUser(null);
                localStorage.removeItem("mdwnh_user");
            };

            const getFirstName = (name) => {
                if (name === "أبو بندر") return "أبو بندر";
                if (name === "ابو مزاحم") return "ابو مزاحم";
                return name.split(' ')[0];
            };

            const attemptAdminLogin = (e) => {
                e.preventDefault();
                if (passwordInput === "144noon") {
                    setAdminMode(true);
                    setShowPasswordPrompt(false);
                    setPasswordInput("");
                } else {
                    alert("كلمة المرور غير صحيحة!");
                }
            };

            const triggerCelebration = (person, points, silent = false) => {
                if (!silent) playPointAudio(points);
                setIsPageSuckingIn(true);
                setTimeout(() => {
                    setCelebration({ user: person, points: 30 });
                    setIsCelebrationClosing(false);
                    triggerConfetti(30);
                    setIsPageSuckingIn(false);
                    setTimeout(() => {
                        const newSparkles = [...Array(30)].map(() => {
                            let top, left;
                            do {
                                top = Math.random() * 100;
                                left = Math.random() * 100;
                            } while (Math.sqrt(Math.pow(top - 50, 2) + Math.pow(left - 50, 2)) < 30);
                            return { top, left, delay: Math.random() * 0.5, speed: 2.5 + Math.random() * 2 };
                        });
                        setSparklePositions(newSparkles);
                        setShowSparkles(true);
                    }, 2000);
                    setTimeout(() => setIsCelebrationClosing(true), 5200);
                    setTimeout(() => { setCelebration(null); setShowSparkles(false); }, 6000);
                }, 700);
            };

            const performAddPoints = async (amount, person, options = {}) => {
                const { silent = false, noToast = false, noConfetti = false, skipCelebrationSound = false } = options;
                setIsAddingPoints(true);
                setAddingPointsLabel(amount);

                let amountNum = 0;
                try {
                    amountNum = parseInt(arabicToLatin(amount)) || 0;
                    if (!silent) await new Promise(resolve => setTimeout(resolve, 300));

                    const playerRef = ref(db, `players/${person}`);
                    const snapshot = await get(playerRef);
                    const currentData = snapshot.val() || { totalPoints: 0 };

                    await set(playerRef, {
                        ...currentData,
                        totalPoints: (currentData.totalPoints || 0) + amountNum,
                        lastUpdated: serverTimestamp()
                    });

                    // Skip history logs for سراج
                    if (person !== "سراج") {
                        const historyDbRef = ref(db, 'history');
                        await push(historyDbRef, {
                            user: person,
                            amount: amountNum,
                            note: options.note || achievementNote || (options.isWheel ? (options.isPunishment ? "دائرة العقاب" : "دائرة المكافأة") : ""),
                            timestamp: Date.now(),
                            isWheel: options.isWheel || false,
                            isPunishment: options.isPunishment || false
                        });
                    }

                    const shouldConfetti = !silent && !noConfetti;

                    if (!silent && !adminMode && amountNum === 30) {
                        triggerCelebration(person, 30, skipCelebrationSound);
                    } else if (shouldConfetti) {
                        if (!silent) playPointAudio(amountNum);
                        triggerConfetti(amountNum);
                    }

                    if (amountNum === 30 && silent) {
                        triggerCelebration(person, 30, true);
                    } else if (silent && amountNum < 30 && !noConfetti) {
                        triggerConfetti(amountNum);
                    }

                    if (amountNum !== 30) {
                        setPointsPopAnim(true);
                        setTimeout(() => setPointsPopAnim(false), 700);
                    }

                    if (!noToast && amountNum !== 30) {
                        showToast("شكرًا على عملكم المتقن!");
                    }
                    setAchievementNote("");

                } catch (error) {
                    alert("تعذر إضافة النقاط. " + error.message);
                } finally {
                    if (amountNum === 30 && !silent) await new Promise(resolve => setTimeout(resolve, 3000));
                    setIsAddingPoints(false);
                    setAddingPointsLabel(null);
                }
            };

            const spinWheel = async (type) => {
                if (wheelSpinning || isAudioLoading) return;

                const result = type === 'PUNISHMENT'
                    ? PUNISHMENTS[Math.floor(Math.random() * PUNISHMENTS.length)]
                    : REWARDS[Math.floor(Math.random() * REWARDS.length)];

                // Pre-load audio
                setIsAudioLoading(true);
                const soundFile = type === 'PUNISHMENT' ? './sounds/العقاب.mp3?v=3' : (result === 30 ? './sounds/المكافأة_كبيرة.mp3?v=3' : './sounds/المكافأة.mp3?v=3');

                try {
                    const audio = new Audio(soundFile);
                    await new Promise((resolve, reject) => {
                        audio.oncanplaythrough = resolve;
                        audio.onerror = reject;
                        // Timeout after 3 seconds if audio fails to load to not block interaction
                        setTimeout(resolve, 3000);
                    });

                    wheelAudioRef.current = audio;
                    setIsAudioLoading(false);

                    setWheelResult(result);
                    setWheelSpinning(true);
                    setShowWheelResultOverlay(false);

                    const items = type === 'PUNISHMENT' ? PUNISHMENTS : REWARDS;
                    const resultIndex = items.indexOf(result);
                    const segmentAngle = 360 / items.length;
                    const extraSpins = 12;

                    const currentRotationMod = wheelRotation % 360;
                    const labelPosFromZero = (resultIndex * segmentAngle) + (segmentAngle / 2);
                    const deltaRotation = (360 - (labelPosFromZero + currentRotationMod) % 360 + 360) % 360;
                    const finalRotation = wheelRotation + deltaRotation + (extraSpins * 360);

                    setWheelRotation(finalRotation);
                    audio.play().catch(e => console.log("Audio play failed", e));

                    // IF Result is 30, we trigger celebration at 8.5 seconds for perfect sync
                    if (type === 'REWARD' && result === 30) {
                        setTimeout(() => {
                            performAddPoints("30", currentUser, { silent: true, isWheel: true });

                    }

                    setTimeout(() => {
                        setWheelSpinning(false);
                        if (type === 'PUNISHMENT') {
                            performAddPoints("0", currentUser, {
                                silent: true,
                                isWheel: true,
                                isPunishment: true,
                                noConfetti: true,
                                noToast: true,

            const performSaveJournal = async () => {

            // Edit popup - opens instead of scrolling to top form

            const saveEditPopup = async () => {
                if (!editPopupNote.trim()) return;

                try {

            // Custom Date Picker helpers
            const openDatePicker = (target) => {

                const base = existing ? new Date(existing) : new Date();
                setPickerMonth(base.getMonth());
                setPickerYear(base.getFullYear());
                setDatePickerTarget(target);

            const selectDate = (day) => {
                const dateStr = `${pickerYear}-${String(pickerMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                if (datePickerTarget === 'edit') {
                    // Preserve existing time, only change the date

                    if (existingTs) {
                        const existingDate = new Date(existingTs);
                        const hours = String(existingDate.getHours()).padStart(2, '0');
                        const mins = String(existingDate.getMinutes()).padStart(2, '0');
                        setEditPopupDate(`${dateStr}T${hours}:${mins}`);

                    }
                } else {
                    // For new journal entries, keep whatever time was already set, or default none

                }
                setShowDatePicker(false);
            };

            const daysInMonth = (m, y) => new Date(y, m + 1, 0).getDate();
            const firstDayOfMonth = (m, y) => new Date(y, m, 1).getDay();

            const ARABIC_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

            const performDeleteJournal = async (id) => {
                if (!confirm("هل أنت متأكد من رغبتك في حذف هذا العمل؟")) return;
                try {
                    const journalRef = ref(db, 'history/' + id);
                    const snapshot = await get(journalRef);
                    const logData = snapshot.val();

                    if (logData) {
                        // 1. Sync Points if it's a point-bearing task
                        if (logData.amount > 0) {
                            const playerRef = ref(db, `players/${logData.user}/totalPoints`);
                            const playerSnap = await get(playerRef);
                            const currentTotal = playerSnap.val() || 0;
                            await set(playerRef, Math.max(0, currentTotal - logData.amount));

                        // 2. Remove the actual log
                        await remove(journalRef);

                    setToast("تم حذف العمل وتحديث الرصيد!");
                    setTimeout(() => setToast(null), 3500);
                } catch (error) {
                    alert("تعذر حذف العمل: " + error.message);
                }

            const performAdminDeleteHistoryEntry = async (log) => {
                if (!confirm(`هل أنت متأكد من حذف هذا الإنجاز لـ ${log.user}؟ سيتم خصم ${log.amount} نقطة من رصيده.`)) return;
                try {
                    // 1. Update Player Score
                    const playerRef = ref(db, `players/${log.user}/totalPoints`);
                    const snapshot = await get(playerRef);
                    const currentPoints = snapshot.val() || 0;
                    await set(playerRef, Math.max(0, currentPoints - log.amount));

                    // 2. Remove History Entry
                    const historyRef = ref(db, `history/${log.id}`);

                    showToast("تم حذف الإنجاز وتحديث الرصيد!");

            const performAdminEditHistoryPoints = async (log) => {
                const newPointsStr = prompt(`تعديل نقاط ${log.user}\nالنقاط الحالية: ${log.amount}\nأدخل النقاط الجديدة:`, log.amount);
                if (newPointsStr === null) return;
                const newPoints = parseInt(newPointsStr);
                if (isNaN(newPoints)) return alert("يرجى إدخال رقم صحيح.");

                try {
                    const diff = newPoints - log.amount;

                    // 1. Update Player Score
                    const playerRef = ref(db, `players/${log.user}/totalPoints`);
                    const snapshot = await get(playerRef);
                    const currentPoints = snapshot.val() || 0;
                    await set(playerRef, Math.max(0, currentPoints + diff));

                    // 2. Update History Entry
                    const historyRef = ref(db, `history/${log.id}/amount`);
                    await set(historyRef, newPoints);

                    showToast("تم تعديل النقاط وتحديث الرصيد!");

            const performSetPoints = async (person) => {
                if (manualTargetPoints === "" || isNaN(manualTargetPoints)) return;
                setIsAddingPoints(true);
                setAddingPointsLabel('SET');

                try {
                    const playerRef = ref(db, `players/${person}`);
                    const snapshot = await get(playerRef);
                    const currentData = snapshot.val() || {};

                    await set(playerRef, {
                        ...currentData,
                        totalPoints: parseInt(manualTargetPoints, 10),
                        lastUpdated: serverTimestamp()
                    });

                    playPointAudio(5); // Plays sounds/1.mp3
                    showToast("تم تعيين النقاط بنجاح!");
                    setManualTargetPoints("");

                } catch (error) {
                    alert("خطأ: " + error.message);
                } finally {
                    setIsAddingPoints(false);
                    setAddingPointsLabel(null);
                }
            };

            const addPoints = (amount, options = {}) => {
                const person = adminMode && targetUser ? targetUser : currentUser;
                if (!person) return;

                if (amount === 60) {
                    setIsAddingPoints(true);
                    setAddingPointsLabel(60);
                    
                    // Preload all assets needed for the +60 animation
                    const preloadAssets = async () => {
                        const assets = [
                            { type: 'audio', src: './sounds/5.mp3?v=3' },
                            { type: 'image', src: './Crown.png' },
                            { type: 'image', src: './Background.png' },
                            { type: 'image', src: './GoldCrown.png' }
                        ];

                        const promises = assets.map(asset => {
                            return new Promise((resolve) => {
                                if (asset.type === 'audio') {
                                    const audio = new Audio(asset.src);
                                    audio.oncanplaythrough = () => resolve(audio);
                                    audio.onerror = () => resolve(null);
                                    // Timeout for audio loading
                                    setTimeout(() => resolve(audio), 5000);
                                } else {
                                    const img = new Image();
                                    img.onload = () => resolve(img);
                                    img.onerror = () => resolve(null);
                                    img.src = asset.src;
                                }
                            });
                        });

                        // Wait for all assets OR a global timeout of 8 seconds, PLUS a mandatory minimum wait of 300ms
                        const minWaitPromise = new Promise(resolve => setTimeout(resolve, 300));
                        const assetLoadPromise = Promise.race([
                            Promise.all(promises),
                            new Promise(resolve => setTimeout(() => resolve([]), 8000))
                        ]);

                        const [results] = await Promise.all([assetLoadPromise, minWaitPromise]);
                        const audioAsset = results.find(a => a instanceof Audio) || new Audio('./sounds/5.mp3?v=3');
                        return audioAsset;
                    };

                    preloadAssets().then((audio) => {
                        setSpecial60({ isActive: true, phase: 'loading', showContinue: false, showAvatarCrown: false, cameraShake: false, user: person });
                        
                        // Add points immediately
                        const add60PointsToDb = async () => {
                            try {
                                const playerRef = ref(db, `players/${person}`);
                                const snapshot = await get(playerRef);
                                const currentData = snapshot.val() || { totalPoints: 0 };

                                await set(playerRef, {
                                    ...currentData,
                                    totalPoints: (currentData.totalPoints || 0) + 60,
                                    lastUpdated: serverTimestamp()
                                });

                                // Skip history logs for سراج
                                if (person !== "سراج") {
                                    const historyDbRef = ref(db, 'history');
                                    await push(historyDbRef, {
                                        user: person,
                                        amount: 60,
                                        note: options.note || achievementNote || "",
                                        timestamp: Date.now(),
                                        isWheel: false,
                                        isPunishment: false
                                    });
                                }
                                setAchievementNote("");
                            } catch (error) {
                                console.error("Failed to add 60 points", error);
                            }
                        };
                        add60PointsToDb();

                        audio.volume = 0.5;
                        
                        const startAnimation = () => {
                            audio.play().catch(e => console.log("Audio play error", e));
                        };
                        
                        audio.onplay = () => {
                            setSpecial60(prev => ({ ...prev, phase: 'black1' }));
                            
                            setTimeout(() => setSpecial60(prev => ({ ...prev, phase: 'crown' })), 3500);
                            setTimeout(() => setSpecial60(prev => ({ ...prev, phase: 'black2' })), 6500);
                            
                            setTimeout(() => {
                                setSpecial60(prev => ({ ...prev, phase: 'celebration' }));
                                triggerConfetti(60); 
                                const newSparkles = [...Array(40)].map(() => {
                                    let top, left;
                                    do {
                                        top = Math.random() * 100;
                                        left = Math.random() * 100;
                                    } while (Math.sqrt(Math.pow(top - 50, 2) + Math.pow(left - 50, 2)) < 30);
                                    return { top, left, delay: Math.random() * 0.5, speed: 2.5 + Math.random() * 2 };
                                });
                                setSparklePositions(newSparkles);
                                setShowSparkles(true);
                                
                                // Crown falls on avatar at exactly 12 seconds
                                setTimeout(() => setSpecial60(prev => ({ ...prev, showAvatarCrown: true })), 2300);
                                // Screen shake fires when the crown actually lands (crown-fall duration later)
                                setTimeout(() => setSpecial60(prev => ({ ...prev, cameraShake: true })), 2560);
                                setTimeout(() => {
                                    setSpecial60(prev => ({ ...prev, showContinue: true }));
                                    setIsAddingPoints(false);
                                    setAddingPointsLabel(null);
                                }, 8500);
                            }, 9500);
                        };

                        startAnimation();
                    });
                } else {
                    performAddPoints(amount, person, options);
                }
            };

            const Toggle = ({ label, active, onClick, colorClass = "bg-verdigris", shadowColor = "31,168,161" }) => (
                <div
                    className="flex flex-col items-center gap-1.5 cursor-pointer select-none group"

                         style={active ? { boxShadow: `0 0 20px rgba(${shadowColor},0.4)` } : {}}>
                        <div className={`w-4 h-4 rounded-full bg-white shadow-md transform transition-transform duration-300 ${active ? 'translate-x-0' : '-translate-x-5'}`}></div>
                    </div>

            );

            const BrandGradientOutline = ({ children }) => (
                <div className="relative p-[6px] rounded-full overflow-hidden group">
                    <div
                        className="absolute inset-0 animate-[spin_4s_linear_infinite]"
                        style={{
                            background: 'conic-gradient(from 0deg, #F4C82B, #F04E3A, #F4C82B, #086FB6, #1FA8A1, #F4C82B)',
                            backgroundSize: '200% 200%'
                        }}
                    ></div>
                    <div className="relative bg-darker rounded-full p-1">
                        {children}
                    </div>
                </div>
            );

            /* ============ صحبة الفجر — النتائج ============
               The round that ran on this site is CLOSED. صحبة الفجر moved into
               the library, where logging a day is two taps from the task list
               instead of a second site, a member picker and a password — which
               is the whole reason so few days were ever logged here. Nothing on
               this page writes to `sabha_fajr` any more; what is left is the
               record of what happened, because deleting a leaderboard is not
               "locking" it.

               Only members who actually SUBMITTED are ranked. A roster wall
               with two dozen zeroes in it is not a result — it is a list of
               people who did not take part, published under a heading that
               says they came last. */
            const sabhaLongestRun = (keys) => {
                const sorted = keys.slice().sort();
                let best = 0, run = 0, prev = null;
                sorted.forEach(k => {
                    const p = k.split('-');
                    const d = new Date(+p[0], +p[1] - 1, +p[2]);
                    run = (prev && Math.round((d - prev) / 86400000) === 1) ? run + 1 : 1;
                    prev = d;
                    if (run > best) best = run;
                });
                return best;
            };

            // One pass over the whole tree, memoised: every card below reads it.
            const sabhaResults = React.useMemo(() => {
                const rows = [];
                Object.keys(sabhaData || {}).forEach(name => {
                    if (name === 'سراج') return;
                    const ent = sabhaData[name] || {};
                    const keys = Object.keys(ent).filter(k => ent[k] && (ent[k].points || 0) > 0);
                    if (!keys.length) return;                    // never submitted
                    let total = 0, fajr = 0, sleep = 0, morning = 0, sticker = 0, full = 0;
                    keys.forEach(k => {
                        const e = ent[k];
                        total += e.points || 0;
                        if (e.fajr) fajr++;
                        if (e.sleep) sleep++;
                        if (e.morning) morning++;
                        if (e.sticker) sticker++;
                        if ((e.points || 0) === 4) full++;
                    });
                    rows.push({
                        name, days: keys.length, total, fajr, sleep, morning, sticker, full,
                        run: sabhaLongestRun(keys),
                        female: SABHA_FEMALE_SET.includes(name)
                    });
                });
                return rows.sort((a, b) => b.total - a.total || b.days - a.days);
            }, [sabhaData]);

            // الإخوة vs الأخوات. The comparison is the AVERAGE per participant,
            // never the total: one team is roughly three times the size of the
            // other, so a total would only ever be reporting the head-count.
            const sabhaTeam = (female) => {
                const rs = sabhaResults.filter(r => r.female === female);
                const sum = (f) => rs.reduce((n, r) => n + r[f], 0);
                const n = rs.length;
                return {
                    n, total: sum('total'), fajr: sum('fajr'), days: sum('days'), full: sum('full'),
                    avg: n ? sum('total') / n : 0,
                    fajrAvg: n ? sum('fajr') / n : 0
                };
            };

            const renderSabhaGrid = () => {
                const males = sabhaTeam(false), females = sabhaTeam(true);
                const shown = sabhaTab === 'all' ? sabhaResults
                    : sabhaResults.filter(r => r.female === (sabhaTab === 'females'));
                const podium = shown.slice(0, 3);
                const rest = shown.slice(3);
                const pink = sabhaTab === 'females';
                const winner = males.avg === females.avg ? null : (males.avg > females.avg ? 'males' : 'females');
                const totalDays = sabhaResults.reduce((n, r) => n + r.days, 0);
                const totalFull = sabhaResults.reduce((n, r) => n + r.full, 0);
                const bestRun = sabhaResults.slice().sort((a, b) => b.run - a.run)[0];
                const bestFajr = sabhaResults.slice().sort((a, b) => b.fajr - a.fajr)[0];
                // podium order on screen: 2nd, 1st, 3rd — the tall one in the middle
                const order = podium.length === 3 ? [podium[1], podium[0], podium[2]]
                    : podium.length === 2 ? [podium[1], podium[0]] : podium;

                return (
                    <div className="flex flex-col items-center w-full">
                        <h2 className={`sabha-fajr-title ${pink ? 'female' : ''}`}>صحبة الفجر</h2>
                        <p className="sabha-fajr-sub">نتائج الجولة الماضية — انتقلت صحبة الفجر إلى المكتبة</p>

                        <a className="sbr-moved" href="https://mdwnstudio.github.io/MdwnhLibrary/">
                            🌙 سجّل يومك الآن من المكتبة
                        </a>

                        <div className="sabha-subtabs">
                            <button className={`sabha-subtab ${sabhaTab === 'all' ? 'is-active' : ''}`}
                                    onClick={() => setSabhaTab('all')}>الكل</button>
                            <button className={`sabha-subtab ${sabhaTab === 'males' ? 'is-active' : ''}`}
                                    onClick={() => setSabhaTab('males')}>الإخوة</button>
                            <button className={`sabha-subtab ${sabhaTab === 'females' ? 'is-active female' : ''}`}
                                    onClick={() => setSabhaTab('females')}>الأخوات</button>
                        </div>

                        <div className={`sabha-board ${pink ? 'females' : ''}`} key={sabhaTab}>
                            {shown.length === 0 ? (
                                <div className="sabha-empty sabha-gender-list">لم يسجّل أحد في هذه الفئة.</div>
                            ) : (
                                <div className="sabha-board-inner sabha-gender-list">

                                    {/* ---- المنصة: الثلاثة الأوائل ---- */}
                                    <div className="sbr-podium">
                                        {order.map((p) => {
                                            const place = podium.indexOf(p) + 1;
                                            return (
                                                <div key={p.name} className={`sbr-p place-${place} ${p.name === sabhaMe ? 'is-me' : ''}`}>
                                                    <span className="sbr-crown">{place === 1 ? '👑' : place === 2 ? '🥈' : '🥉'}</span>
                                                    <div className="sbr-p-av">
                                                        <img src={avatarSrc(p.name)} alt={p.name} loading="lazy"
                                                             onError={(e) => { e.target.src = AVATAR_FALLBACK; }} />
                                                    </div>
                                                    <span className="sbr-p-name">{p.name}</span>
                                                    <span className="sbr-p-pts">{toArabicNum(p.total)}</span>
                                                    <span className="sbr-p-days">{toArabicNum(p.days)} يوم</span>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* ---- البقية ---- */}
                                    {rest.length > 0 && (
                                        <div className="sbr-list">
                                            {rest.map((p, i) => (
                                                <div key={p.name} className={`sbr-row ${p.name === sabhaMe ? 'is-me' : ''}`}>
                                                    <span className="sbr-rank">{toArabicNum(i + 4)}</span>
                                                    <div className="sbr-av">
                                                        <img src={avatarSrc(p.name)} alt={p.name} loading="lazy"
                                                             onError={(e) => { e.target.src = AVATAR_FALLBACK; }} />
                                                    </div>
                                                    <div className="sbr-who">
                                                        <b>{p.name}</b>
                                                        <span>{toArabicNum(p.days)} يوم · 🔥 {toArabicNum(p.run)} · 🌅 {toArabicNum(p.fajr)}</span>
                                                    </div>
                                                    <span className="sbr-pts">{toArabicNum(p.total)}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
