<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ستوديو مدونة - قائمة الانجاز</title>

    <!-- Google Fonts: Rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind Cached CSS -->
    <link href="./style.css" rel="stylesheet">

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .cubic-bezier-wheel {
            transition-timing-function: cubic-bezier(0.15, 0, 0.1, 1) !important;
        }

        .vertical-text {
            display: inline-block;
            transform: rotate(90deg);
            transform-origin: center;
            white-space: nowrap;
            max-width: 150px;
        }
    </style>

    <!-- ============ صحبة الفجر (Sabha Fajr) feature styles ============ -->
    <style>
        :root {
            --sabha-blue: #7EB8D4;
            --sabha-blue-soft: #9fd0e6;
            --sabha-blue-deep: #4f8fb0;
            --sabha-ink: #0c1a24;
            --sabha-green: #3bb9ab;
            --sabha-yellow: #f4c82b;
            --sabha-pink: #E8A0BF;
            --sabha-pink-soft: #f0c4d8;
            --sabha-pink-deep: #C96EA0;
        }

        /* ---- Background cross-fade layers ---- */
        .sabha-bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            transition: opacity 1.1s ease;
        }
        .sabha-bg-points { background-image: url('./BG.jpg'); }
        /* Sabha Fajr tab: solid deep-blue — covers the animated blobs entirely */
        .sabha-bg-fajr { background: #0b1824; }
        /* Female overlay: fades in on top of the blue base to give a warm pink-dark tint */
        .sabha-bg-female { background: linear-gradient(180deg, #1a0c18 0%, #120910 55%, #0d080f 100%); }

        /* ---- Main tab bar ---- */
        .sabha-tabbar {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px;
            border-radius: 999px;
            background: rgba(18, 18, 22, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }
        .sabha-tab {
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            padding: 11px 28px;
            border: none;
            background: transparent;
            color: rgba(250, 249, 247, 0.55);
            border-radius: 999px;
            cursor: pointer;
            transition: color .3s ease, background .45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow .45s ease, transform .2s ease;
        }
        .sabha-tab:hover { color: rgba(250, 249, 247, 0.9); }
        .sabha-tab:active { transform: scale(0.95); }
        .sabha-tab.points.is-active {
            color: #1a1a1a;
            background: var(--sabha-yellow);
            box-shadow: 0 0 24px rgba(244, 200, 43, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        .sabha-tab.fajr.is-active {
            color: var(--sabha-ink);
            background: var(--sabha-blue);
            box-shadow: 0 0 26px rgba(126, 184, 212, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
            transition: background .45s ease, box-shadow .45s ease, color .45s ease;
        }
        .sabha-tab.fajr.is-active.female {
            background: var(--sabha-pink);
            box-shadow: 0 0 26px rgba(232, 160, 191, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        /* ---- Sliding viewport / panels ---- */
        .sabha-viewport { position: relative; width: 100%; overflow: hidden; min-height: 100vh; }
        .sabha-panel {
            width: 100%;
            transition: transform .55s cubic-bezier(0.22, 1, 0.36, 1), opacity .4s ease;
            will-change: transform, opacity;
        }

        /* ---- Fajr panel header ---- */
        .sabha-fajr-title {
            font-family: 'Rubik', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: var(--sabha-blue);
            text-shadow: 0 0 22px rgba(126, 184, 212, 0.45);
            margin-bottom: 4px;
            text-align: center;
            transition: color .45s ease, text-shadow .45s ease;
        }
        .sabha-fajr-title.female {
            color: var(--sabha-pink);
            text-shadow: 0 0 22px rgba(232, 160, 191, 0.45);
        }
        .sabha-fajr-sub {
            color: rgba(250, 249, 247, 0.55);
            font-size: 0.9rem;
            margin-bottom: 22px;
            text-align: center;
        }

        /* ---- Sub-tabs (الإخوة / الأخوات) ---- */
        .sabha-subtabs {
            display: inline-flex;
            gap: 6px;
            padding: 5px;
            border-radius: 999px;
            background: rgba(126, 184, 212, 0.07);
            border: 1px solid rgba(126, 184, 212, 0.18);
            margin-bottom: 26px;
        }
        .sabha-subtab {
            font-family: 'Rubik', sans-serif;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 22px;
            border: none;
            background: transparent;
            color: rgba(250, 249, 247, 0.5);
            border-radius: 999px;
            cursor: pointer;
            transition: all .35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .sabha-subtab:hover { color: rgba(250, 249, 247, 0.85); }
        .sabha-subtab.is-active {
            color: var(--sabha-ink);
            background: var(--sabha-blue);
            box-shadow: 0 0 18px rgba(126, 184, 212, 0.5);
        }
        .sabha-subtab.is-active.female {
            background: var(--sabha-pink);
            box-shadow: 0 0 18px rgba(232, 160, 191, 0.55);
        }

        /* ---- Gender switch animation ---- */
        @keyframes sabhaGenderIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .sabha-gender-list { animation: sabhaGenderIn .35s cubic-bezier(0.22, 1, 0.36, 1); }

        /* ---- Week navigation slide ---- */
        @keyframes sabhaSlideNext { from { opacity: 0; transform: translateX(-34px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes sabhaSlidePrev { from { opacity: 0; transform: translateX(34px); } to { opacity: 1; transform: translateX(0); } }
        .sabha-anim-next { animation: sabhaSlideNext .32s cubic-bezier(0.22, 1, 0.36, 1); }
        .sabha-anim-prev { animation: sabhaSlidePrev .32s cubic-bezier(0.22, 1, 0.36, 1); }

        /* ---- Leaderboard ---- */
        .sabha-board { width: 100%; max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; min-height: 60vh; }
        /* Grid row: [avatar 40px] [name flex] [streak 46px] [dots 102px] [total 36px] [rank 26px] */
        .sabha-row {
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr) 46px 102px 36px 26px;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            border-radius: 22px;
            background: rgba(26, 26, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
        }
        .sabha-row:hover { transform: translateY(-2px); border-color: rgba(126, 184, 212, 0.3); }
        .sabha-row.is-me {
            border-color: rgba(126, 184, 212, 0.5);
            background: linear-gradient(120deg, rgba(126, 184, 212, 0.14), rgba(26, 26, 30, 0.65));
            box-shadow: 0 0 26px rgba(126, 184, 212, 0.18);
            cursor: pointer;
        }
        /* ---- Female (pink) overrides ---- */
        .sabha-board.females .sabha-row:hover { border-color: rgba(232, 160, 191, 0.35); }
        .sabha-board.females .sabha-row.is-me {
            border-color: rgba(232, 160, 191, 0.55);
            background: linear-gradient(120deg, rgba(232, 160, 191, 0.14), rgba(26, 26, 30, 0.65));
            box-shadow: 0 0 26px rgba(232, 160, 191, 0.2);
        }
        .sabha-board.females .sabha-chevron { color: var(--sabha-pink); }
        .sabha-board.females .sabha-total { color: var(--sabha-pink); text-shadow: 0 0 12px rgba(232, 160, 191, 0.4); }
        .sabha-board.females .sabha-day-mini i.on { background: var(--sabha-pink); box-shadow: 0 0 5px rgba(232, 160, 191, 0.6); }
        .sabha-board.females .sabha-expand-inner::-webkit-scrollbar-thumb { background: rgba(232, 160, 191, 0.35); }
        .sabha-board.females .sabha-streak.has-streak { color: #f4a0c8; }
        .sabha-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #262626;
        }
        .sabha-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sabha-streak {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 900; font-size: 11px; color: rgba(250,249,247,0.3);
            line-height: 1.3; text-align: center;
        }
        .sabha-streak.has-streak { color: #ffb347; }
        .sabha-streak .s-fire { font-size: 18px; line-height: 1; filter: grayscale(1) opacity(0.3); }
        .sabha-streak.has-streak .s-fire { filter: none; }
        .sabha-streak .s-num { font-size: 11px; }
        .sabha-fire-dead { filter: grayscale(1) opacity(0.35); }
        .sabha-name {
            font-weight: 700; font-size: 15px; color: #faf9f7;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; gap: 5px;
        }
        .sabha-chevron { color: var(--sabha-blue); font-size: 11px; transition: transform .4s ease; flex-shrink: 0; }
        .sabha-chevron.open { transform: rotate(180deg); }
        .sabha-dots { display: flex; gap: 5px; align-items: center; justify-content: center; }
        .sabha-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all .3s ease;
        }
        .sabha-dot.full { background: var(--sabha-green); border-color: var(--sabha-green); box-shadow: 0 0 8px rgba(59, 185, 171, 0.6); }
        .sabha-dot.partial { background: var(--sabha-yellow); border-color: var(--sabha-yellow); box-shadow: 0 0 8px rgba(244, 200, 43, 0.5); }
        .sabha-total {
            font-weight: 900; font-size: 20px;
            color: var(--sabha-blue);
            min-width: 30px; text-align: center; flex-shrink: 0;
            text-shadow: 0 0 12px rgba(126, 184, 212, 0.35);
        }
        .sabha-rank {
            font-weight: 900; font-size: 13px;
            color: rgba(250, 249, 247, 0.4);
            min-width: 20px; text-align: center; flex-shrink: 0;
        }
        .sabha-rank.top { color: var(--sabha-yellow); }

        /* ---- My-row expandable history ---- */
        .sabha-expand {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height .5s cubic-bezier(0.22, 1, 0.36, 1), opacity .4s ease, margin .4s ease;
        }
        .sabha-expand.open { max-height: 200px; opacity: 1; margin-top: -4px; }
        .sabha-expand-inner { display: flex; gap: 8px; overflow-x: auto; padding: 12px 6px; }
        .sabha-expand-inner::-webkit-scrollbar { height: 5px; }
        .sabha-expand-inner::-webkit-scrollbar-thumb { background: rgba(126, 184, 212, 0.3); border-radius: 10px; }
        .sabha-day {
            flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 8px 10px; border-radius: 14px;
            background: rgba(12, 18, 26, 0.6); border: 1px solid rgba(255, 255, 255, 0.06);
            min-width: 58px;
        }
        .sabha-day-date { font-size: 10px; color: rgba(250, 249, 247, 0.55); font-weight: 700; text-align: center; line-height: 1.3; }
        .sabha-day-pts { font-weight: 900; font-size: 16px; }
        .sabha-day-mini { display: flex; gap: 3px; }
        .sabha-day-mini i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); display: block; }
        .sabha-day-mini i.on { background: var(--sabha-blue); box-shadow: 0 0 5px rgba(126, 184, 212, 0.6); }

        .sabha-empty { text-align: center; color: rgba(250, 249, 247, 0.5); font-weight: 700; padding: 40px 0; }

        /* ---- Weekly grid (members × past 7 days) — 35% larger ---- */
        .sabha-board-inner { width: 100%; max-width: 1300px; margin: 0 auto; }
        .sabha-grid-wrap {
            width: 100%;
            overflow-x: auto;
            border-radius: 0 0 20px 20px;
            border: 1px solid rgba(126, 184, 212, 0.14);
            border-top: none;
            background: rgba(10, 16, 24, 0.7);
            -webkit-overflow-scrolling: touch;
        }
        .sabha-grid-wrap::-webkit-scrollbar { height: 8px; }
        .sabha-grid-wrap::-webkit-scrollbar-thumb { background: rgba(126, 184, 212, 0.35); border-radius: 10px; }
        .sabha-grid {
            display: grid;
            /* name col wider (room for rank + pts), day cols 35% bigger */
            grid-template-columns: 210px repeat(7, minmax(100px, 1fr));
            min-width: 920px;
        }
        /* Navigation band sits OUTSIDE the scroll wrap so the arrows are always visible */
        .sabha-grid-band {
            display: flex; align-items: center; justify-content: space-between;
            font-weight: 900; font-size: 1.05rem;
            color: #faf9f7; padding: 9px 14px; letter-spacing: 0.5px;
            background: var(--sabha-blue-deep);
            border-radius: 20px 20px 0 0;
        }
        .sabha-week-name { flex: 1; text-align: center; }
        .sabha-week-nav {
            flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
            border: none; cursor: pointer;
            background: rgba(255, 255, 255, 0.14); color: #faf9f7;
            font-size: 18px; font-weight: 900; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s ease, transform .15s ease;
        }
        .sabha-week-nav:hover { background: rgba(255, 255, 255, 0.28); }
        .sabha-week-nav:active { transform: scale(0.9); }
        .sabha-board.females .sabha-week-nav { background: rgba(255, 255, 255, 0.16); }
        .sabha-gcell {
            display: flex; align-items: center; justify-content: center;
            min-height: 70px; font-size: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-inline-start: 1px solid rgba(255, 255, 255, 0.04);
        }
        .sabha-gcell.head {
            flex-direction: column; gap: 3px; padding: 10px 6px;
            font-weight: 900; color: #faf9f7;
            background: rgba(79, 143, 176, 0.55);
            min-height: 56px;
        }
        .sabha-gcell.head .gh-day { font-size: 14px; }
        .sabha-gcell.head .gh-num { font-size: 12px; opacity: 0.75; }
        .gh-day-short { display: none; } /* shown only on mobile */
        .sabha-gcell.head.today {
            background: rgba(126, 184, 212, 0.85);
            color: #0c1a24;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
        }
        .sabha-gcell.head.corner {
            position: sticky; right: 0; z-index: 4;
            background: #0e1824; color: rgba(250,249,247,0.7); font-size: 14px; font-weight: 900;
            min-height: 56px;
        }
        .sabha-gcell.name {
            position: sticky; right: 0; z-index: 2;
            background: #0e1824;
            justify-content: flex-start; gap: 9px; padding: 8px 14px;
            font-weight: 700; color: #faf9f7;
        }
        /* Rank badge */
        .sabha-grank {
            flex-shrink: 0; font-weight: 900; font-size: 12px;
            color: rgba(250,249,247,0.3); min-width: 18px; text-align: center;
        }
        .sabha-grank.top1 { color: #ffd700; }
        .sabha-grank.top2 { color: #c0c8d0; }
        .sabha-grank.top3 { color: #cd7f32; }
        /* Avatar with fire-badge overlay */
        .sabha-gname-av-wrap { position: relative; flex-shrink: 0; }
        .sabha-gname-av { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; border: 1.5px solid rgba(255, 255, 255, 0.12); background: #262626; }
        .sabha-gname-av img { width: 100%; height: 100%; object-fit: cover; }
        .sabha-gav-badge {
            position: absolute; bottom: -5px; left: -6px;
            display: flex; align-items: center; gap: 1px;
            background: rgba(12, 14, 18, 0.92); border-radius: 999px;
            padding: 1px 4px 1px 2px; line-height: 1;
            font-size: 10px; font-weight: 900;
            color: rgba(250, 249, 247, 0.25);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .sabha-gav-badge .bf { font-size: 12px; filter: grayscale(1) opacity(0.3); }
        .sabha-gav-badge.on { color: #ffb347; }
        .sabha-gav-badge.on .bf { filter: none; }
        /* Name + total pts stacked */
        .sabha-gname-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
        .sabha-gname-txt { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sabha-gname-pts { font-size: 11px; font-weight: 900; color: var(--sabha-blue); opacity: 0.85; }
        .sabha-gcell.val { font-weight: 800; }
        .sabha-gcell.val .gv { font-size: 15px; letter-spacing: 0.5px; }
        /* Score-based colors — each point lights up a distinct brand color */
        .sabha-gcell.val.p0 { background: rgba(14, 20, 30, 0.6); color: rgba(250, 249, 247, 0.3); }
        .sabha-gcell.val.p1 { background: rgba(244, 200, 43, 0.13); color: #f4c82b; box-shadow: inset 0 0 0 1.5px rgba(244, 200, 43, 0.55); }
        .sabha-gcell.val.p2 { background: rgba(240, 78, 58, 0.14); color: #ff8a78; box-shadow: inset 0 0 0 1.5px rgba(240, 78, 58, 0.55); }
        .sabha-gcell.val.p3 { background: rgba(8, 111, 182, 0.20); color: #6db3e6; box-shadow: inset 0 0 0 1.5px rgba(8, 111, 182, 0.65); }
        .sabha-gcell.val.p4 { background: rgba(59, 185, 171, 0.20); color: #5fe0cf; box-shadow: inset 0 0 0 1.5px rgba(59, 185, 171, 0.65); }
        .sabha-gcell.val.today { outline: 1.5px solid rgba(126, 184, 212, 0.6); outline-offset: -1.5px; }
        .sabha-gcell.name.me { background: #122030; box-shadow: inset 3px 0 0 var(--sabha-blue); }
        .sabha-gcell.val.me.today { outline-color: rgba(126, 184, 212, 0.9); }
        .sabha-gcell.name.me.logged-today { background: rgba(59, 185, 171, 0.13); box-shadow: inset 3px 0 0 #5fe0cf; }
        .sabha-gcell.val.me.logged-today { box-shadow: inset 0 1.5px 0 rgba(95, 224, 207, 0.35), inset 0 -1.5px 0 rgba(95, 224, 207, 0.35); }
        .sabha-board.females .sabha-gcell.name.me.logged-today { background: rgba(59, 185, 171, 0.13); box-shadow: inset 3px 0 0 #5fe0cf; }
        /* female (pink) accents */
        .sabha-board.females .sabha-grid-band { background: var(--sabha-pink-deep); }
        .sabha-board.females .sabha-gcell.head { background: rgba(201, 110, 160, 0.45); }
        .sabha-board.females .sabha-gcell.head.today { background: rgba(232, 160, 191, 0.85); color: #1a0c18; }
        .sabha-board.females .sabha-gcell.name.me { background: #1e0f1c; box-shadow: inset 3px 0 0 var(--sabha-pink); }
        .sabha-board.females .sabha-gav-badge.on { color: #f4a0c8; }
        .sabha-board.females .sabha-gname-pts { color: var(--sabha-pink); }
        .sabha-board.females .sabha-gcell.val.today { outline-color: rgba(232, 160, 191, 0.6); }
        .sabha-board.females .sabha-grid-wrap { border-color: rgba(232, 160, 191, 0.14); }
        .sabha-board.females .sabha-grid-wrap::-webkit-scrollbar-thumb { background: rgba(232, 160, 191, 0.4); }

        /* ---- Floating add button ---- */
        .sabha-fab {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
            z-index: 40;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; border-radius: 999px; border: none;
            font-family: 'Rubik', sans-serif; font-weight: 900; font-size: 15px;
            color: var(--sabha-ink);
            background: linear-gradient(135deg, var(--sabha-blue-soft), var(--sabha-blue));
            box-shadow: 0 10px 30px rgba(126, 184, 212, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: box-shadow .3s ease;
            animation: sabhaFabIn .5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .sabha-fab:hover { box-shadow: 0 16px 42px rgba(126, 184, 212, 0.65), inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
        .sabha-fab.female { background: linear-gradient(135deg, var(--sabha-pink-soft), var(--sabha-pink-deep)); box-shadow: 0 10px 30px rgba(232, 160, 191, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.2); }

                start.setHours(0, 0, 0, 0);
            }
            const days = [];
            for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
                const k = sabhaKey(d);
                const e = entries[k] || null;
                days.push({ date: new Date(d), key: k, points: e ? (e.points || 0) : 0, entry: e });
            }
            return days.reverse();
        };

        // Past 7 days newest-first: [today, yesterday, ..., 6 days ago].
        // In RTL the grid renders columns right→left, so index 0 (today) is the
        // rightmost day column — immediately visible next to the sticky name column.
        // Sunday of the week that `offset` weeks away from this week (0 = current).
        const sabhaWeekSunday = (offset = 0) => {
            const today = sabhaStartOfToday();
            const sunday = new Date(today);
            sunday.setDate(today.getDate() - today.getDay() + offset * 7);
            return sunday;
        };
        // Stable Sunday→Saturday week. Index 0 = Sunday (rightmost in RTL).
        const sabhaWeekDays = (offset = 0) => {
            const sunday = sabhaWeekSunday(offset);
            const todayKey = sabhaKey(sabhaStartOfToday());
            const arr = [];
            for (let i = 0; i <= 6; i++) {
                const d = new Date(sunday);
                d.setDate(sunday.getDate() + i);
                const key = sabhaKey(d);
                arr.push({ date: d, key, isToday: key === todayKey });
            }
            return arr;
        };
        // Label for the selected week, e.g. "31 مايو – 6 يونيو".
        const sabhaWeekRangeLabel = (offset = 0) => {
            const s = sabhaWeekSunday(offset);
            const e = new Date(s); e.setDate(s.getDate() + 6);
            return s.getMonth() === e.getMonth()
                ? `${s.getDate()} – ${e.getDate()} ${SABHA_MONTHS[e.getMonth()]}`
                : `${s.getDate()} ${SABHA_MONTHS[s.getMonth()]} – ${e.getDate()} ${SABHA_MONTHS[e.getMonth()]}`;
        };

        // Daily Log Screen — pick a date, toggle activities, submit to firebase
        function SabhaLogScreen({ user, entries, db, onClose, onLogged, onComplete }) {
            const { ref, set } = window.firebaseModular;
            const today = sabhaStartOfToday();

            // Fixed window: today + the 3 days before it. Skip days already logged.
            const candidates = [];
            for (let off = 0; off <= 3; off++) {
                const d = new Date(today); d.setDate(d.getDate() - off);
                const k = sabhaKey(d);
                if (!entries || !entries[k]) candidates.push({ date: d, key: k });
            }

            const [selectedKey, setSelectedKey] = useState(candidates[0] ? candidates[0].key : sabhaKey(today));
            const [pills, setPills] = useState({ fajr: false, sleep: false, morning: false, sticker: false });
            const [submitting, setSubmitting] = useState(false);
            const [closing, setClosing] = useState(false);
            const soundsRef = useRef([]);

            // Preload escalation sounds 1..4 (silent if the folder/files don't exist)
            useEffect(() => {
                const arr = [];
                for (let i = 1; i <= 4; i++) {
                    try {
                        const a = new Audio(`./sounds/Suhba/${i}.mp3`);
                        a.preload = 'auto';
                        a.onerror = () => {};
                        arr.push(a);
                    } catch (e) { arr.push(null); }
                }
                soundsRef.current = arr;
            }, []);

            // Play sound N (1..4). Stops anything already playing so sounds don't overlap.
            const playSound = (n) => {
                if (n < 1 || n > 4) return;
                try {
                    const base = soundsRef.current[n - 1];
                    const a = (base && base.cloneNode) ? base.cloneNode() : new Audio(`./sounds/Suhba/${n}.mp3`);
                    a.volume = 0.6;
                    a.play().catch(() => {});
                } catch (e) {}
            };

            // Burst of confetti at a screen point, tinted to the pill's color.
            const fireConfetti = (x, y, color) => {
                if (typeof confetti !== 'function') return;
                confetti({
                    particleCount: 40,
                    spread: 65,
                    startVelocity: 30,
                    gravity: 0.95,
                    scalar: 0.85,
                    ticks: 90,
                    origin: { x: x / window.innerWidth, y: y / window.innerHeight },
                    colors: [color, '#ffffff', '#faf9f7'],
                    disableForReducedMotion: true,
                    zIndex: 9999
                });
            };

            const togglePill = (key, color, ev) => {
                const turningOn = !pills[key];
                if (turningOn) {
                    // sound is based on how many were ALREADY selected before this one:
                    // 0 selected -> 1.mp3, 1 selected -> 2.mp3, ... (= the new total)
                    const cur = (pills.fajr ? 1 : 0) + (pills.sleep ? 1 : 0) + (pills.morning ? 1 : 0) + (pills.sticker ? 1 : 0);
                    playSound(cur + 1);
                    if (ev && ev.currentTarget) {
                        const r = ev.currentTarget.getBoundingClientRect();
                        fireConfetti(r.left + r.width / 2, r.top + r.height / 2, color);
                    }
                }
                setPills(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const changeDate = (k) => {
                setSelectedKey(k);
                setPills({ fajr: false, sleep: false, morning: false, sticker: false });
            };

            const count = (pills.fajr ? 1 : 0) + (pills.sleep ? 1 : 0) + (pills.morning ? 1 : 0) + (pills.sticker ? 1 : 0);
            const requestClose = (cb) => { setClosing(true); setTimeout(cb, 330); };

            const submit = async () => {
                if (count === 0 || submitting) return;
                setSubmitting(true);
                try {
                    const payload = {
                        fajr: pills.fajr, sleep: pills.sleep, morning: pills.morning, sticker: pills.sticker,
                        points: count, timestamp: Date.now()
                    };
                    await set(ref(db, `sabha_fajr/${user}/${selectedKey}`), payload);
                    try { const a = new Audio('./sounds/Suhba/اكمال.mp3'); a.volume = 0.7; a.play().catch(() => {}); } catch (e) {}
                    if (count === 4) requestClose(() => onComplete(user));
                    else requestClose(onLogged);
                } catch (e) {
                    alert('تعذر التسجيل: ' + e.message);
                    setSubmitting(false);
                }
            };

            const allLogged = candidates.length === 0;

            return (
                <div className={`sabha-log ${closing ? 'closing' : ''}`}>
                    <div className="sabha-log-inner">
                        <div className="sabha-log-header">
                            <div className="sabha-log-av">
                                <img src={`./MdwnhMembers/${user}.png`} alt={user} onError={(e) => { e.target.src = AVATAR_FALLBACK; }} />
                            </div>
                            <div className="sabha-log-name">{user}</div>
                            <div className="sabha-log-tag">سجّل يومك ✦</div>
                        </div>

                        {allLogged ? (
                            <div style={{ textAlign: 'center' }}>
                                <div className="sabha-empty">ما شاء الله، لقد سجّلت كل أيامك المتاحة ✓</div>
                                <button className="sabha-back" onClick={() => requestClose(onClose)}>رجوع</button>
                            </div>
                        ) : (
                            <>
                                <div className="sabha-dates">
                                    {candidates.map(c => {
                                        const isToday = c.key === sabhaKey(today);
                                        return (
                                            <button
                                                key={c.key}
                                                onClick={() => changeDate(c.key)}
                                                className={`sabha-datechip ${selectedKey === c.key ? 'is-active' : ''}`}
                                            >
                                                <span className="d-day">{isToday ? 'اليوم' : SABHA_WEEKDAYS[c.date.getDay()]}</span>
                                                <span className="d-num">{toArabicNum(c.date.getDate())}</span>
                                            </button>
                                        );
                                    })}
                                </div>

                                <div className="sabha-pills">
                                    {SABHA_ACTIVITIES.map(a => (
                                        <button
                                            key={a.key}
                                            onClick={(ev) => togglePill(a.key, a.color, ev)}
                                            className={`sabha-pill ${pills[a.key] ? 'on' : ''}`}
                                            style={{ '--pc': a.color }}
                                        >
                                            <span className="sabha-pill-emoji">{a.emoji}</span>
                                            <span className="sabha-pill-label">{a.label}</span>
                                            <span className="sabha-pill-check">✓</span>
                                        </button>
                                    ))}
                                </div>

                                <button className="sabha-submit" onClick={submit} disabled={count === 0 || submitting}>
                                    {submitting ? <div className="loader"></div> : <>سجّل ✓</>}
                                </button>
                                <button className="sabha-back" onClick={() => requestClose(onClose)}>رجوع</button>
                                <p className="sabha-rules-note">
                                    اليوم فيه ٤ نقاط، كل بند نقطة:<br />
                                    🌙 النوم الباكر «قبل ١٢ص»<br />
                                    🌅 صلاة الفجر «قبل الشروق»<br />
                                    💼 عمل الصباح «مدونة، تدريب، مذاكرة»<br />
                                    📌 التوثيق بملصق «روم توثيق الروتين»
                                </p>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // 4/4 completion popup — celebratory but calm
        function SabhaCompletionPopup({ user, onClose }) {

            return (
                <div className="sabha-complete">
                    <div className="sabha-complete-card">
                        <div className="sabha-complete-ring">
                            <div className="sabha-ring-inner">
                                <img src={`./MdwnhMembers/${user}.png`} alt={user} onError={(e) => { e.target.src = AVATAR_FALLBACK; }} />
                            </div>
                        </div>
                        <h2 className="sabha-complete-title">جزيتم خيرًا!</h2>
                        <p className="sabha-complete-sub">4/4 — {user}</p>
                        <div className="sabha-shimmer"></div>
                        <button className="sabha-complete-btn" onClick={onClose}>تابع</button>
                    </div>
                </div>
            );
        }

        function App() {
            const [db, setDb] = useState(null);
            const [dbError, setDbError] = useState(null);

            useEffect(() => {
                const initFb = () => {
                    if (window.firebaseModular && !db) {
                        try {
                            const { initializeApp, getApp, getApps, getDatabase } = window.firebaseModular;
                            const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
                            setDb(getDatabase(app));
                        } catch (e) {
                            setDbError(e.message);
                        }
                    }
                };
                if (window.firebaseModular) initFb();
                else window.addEventListener('firebaseReady', initFb);
                return () => window.removeEventListener('firebaseReady', initFb);
            }, [db]);

            if (dbError) {
                return <div className="p-10 text-center text-carmine font-bold text-xl">حدث خطأ: {dbError}</div>;
            }

            if (!db) {
                return (
                    <div className="flex h-screen items-center justify-center">
                        <div className="loader !w-16 !h-16 !border-4 !border-spanish"></div>
                    </div>
                );
            }
            return <Game db={db} />;
        }

        function Game({ db }) {
            const { ref, onValue, set, get, push, remove, serverTimestamp } = window.firebaseModular;

            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem("mdwnh_user") || null);
            const [targetUser, setTargetUser] = useState(null);
            const [players, setPlayers] = useState([]);

            const [isAddingPoints, setIsAddingPoints] = useState(false);
            const [addingPointsLabel, setAddingPointsLabel] = useState(null);
            const [manualTargetPoints, setManualTargetPoints] = useState("");
            const [achievementNote, setAchievementNote] = useState("");
            const [historyLogs, setHistoryLogs] = useState([]);

            const [showJournalModal, setShowJournalModal] = useState(false);
            const [journalNote, setJournalNote] = useState("");
            const [journalDate, setJournalDate] = useState("");
            const [isAddingJournal, setIsAddingJournal] = useState(false);
            const [editingJournalId, setEditingJournalId] = useState(null);

            // Lucky Wheel State
            const [showWheelModal, setShowWheelModal] = useState(false);
            const [activeWheelType, setActiveWheelType] = useState(null); // 'PUNISHMENT' | 'REWARD' | null
            const [wheelSpinning, setWheelSpinning] = useState(false);
            const [wheelRotation, setWheelRotation] = useState(0);
            const [wheelResult, setWheelResult] = useState(null);
            const [showWheelResultOverlay, setShowWheelResultOverlay] = useState(false);
            const [isAudioLoading, setIsAudioLoading] = useState(false);
            const wheelAudioRef = useRef(null);

            // Edit popup state
            const [editPopup, setEditPopup] = useState(null); // { log } or null
            const [editPopupNote, setEditPopupNote] = useState("");
            const [editPopupDate, setEditPopupDate] = useState("");
            const [isEditSaving, setIsEditSaving] = useState(false);

            // Custom date picker state
            const [showDatePicker, setShowDatePicker] = useState(false);
            const [datePickerTarget, setDatePickerTarget] = useState(null); // 'main' or 'edit'
            const [pickerMonth, setPickerMonth] = useState(new Date().getMonth());
            const [pickerYear, setPickerYear] = useState(new Date().getFullYear());

            // Member password system
            const [pendingUser, setPendingUser] = useState(null);
            const [memberPasswordMode, setMemberPasswordMode] = useState(null); // 'set' | 'enter'
            const [memberPasswordInput, setMemberPasswordInput] = useState("");
            const [memberPasswordError, setMemberPasswordError] = useState("");
            const [isMemberPasswordLoading, setIsMemberPasswordLoading] = useState(false);

            // Helper to handle Arabic numerals during data entry
            const arabicToLatin = (str) => {
                const map = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };
                return String(str).replace(/[٠-٩]/g, (mat) => map[mat]);
            };
            const [historyFilterUser, setHistoryFilterUser] = useState("ALL");
            const [historySettings, setHistorySettings] = useState({ showLogs: true, showPunishments: true, showRewards: true, showManualPoints: true });

            const [globalPasswordsEnabled, setGlobalPasswordsEnabled] = useState(true);
            const [showMemberSelectOverlay, setShowMemberSelectOverlay] = useState(null); // 'history' or 'target'

            const [celebration, setCelebration] = useState(null);
            const [isCelebrationClosing, setIsCelebrationClosing] = useState(false);
            const [showSparkles, setShowSparkles] = useState(false);
            const [sparklePositions, setSparklePositions] = useState([]);
            const [isPageSuckingIn, setIsPageSuckingIn] = useState(false);
            const [pointsPopAnim, setPointsPopAnim] = useState(false);

            const [special60, setSpecial60] = useState({ isActive: false, phase: null, showContinue: false, user: null });
            const [toast, setToast] = useState(null); // { message, visible }
            const [dbError, setDbError] = useState(null);

            const [adminMode, setAdminMode] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [showPasswordPrompt, setShowPasswordPrompt] = useState(false);

            // صحبة الفجر state
            const [mainTab, setMainTab] = useState('points'); // 'points' | 'fajr'
            const [sabhaGender, setSabhaGender] = useState('males'); // 'males' | 'females'
            const [sabhaData, setSabhaData] = useState({});
            const [showSabhaPicker, setShowSabhaPicker] = useState(false);
            const [sabhaLogUser, setSabhaLogUser] = useState(null);
            const [sabhaAlreadyLoggedWarning, setSabhaAlreadyLoggedWarning] = useState(null); // name | null
            const [sabhaWeekOffset, setSabhaWeekOffset] = useState(0); // 0 = current week, -1 = previous, +1 = next
            const [sabhaAnim, setSabhaAnim] = useState('gender'); // 'gender' | 'next' | 'prev' — drives the board transition

            // Days a member can still log within the fixed window (today + the 3 prior days).
            const sabhaLoggableCount = (name) => {
                const ent = sabhaData[name] || {};
                const t = sabhaStartOfToday();
                let c = 0;
                for (let off = 0; off <= 3; off++) {
                    const d = new Date(t); d.setDate(t.getDate() - off);
                    if (!ent[sabhaKey(d)]) c++;
                }
                return c;
            };
            const [sabhaComplete, setSabhaComplete] = useState(null); // { user } | null
            const [expandedSabhaRow, setExpandedSabhaRow] = useState(false);
            const [sabhaMe, setSabhaMe] = useState(() => localStorage.getItem('sabha_me') || localStorage.getItem('mdwnh_user') || null);
            const sabhaLoginIntentRef = useRef(false); // synchronous flag: login is for the Fajr daily log

            useEffect(() => {
                const playersRef = ref(db, 'players');
                const unsubscribe = onValue(playersRef, (snapshot) => {
                    setDbError(null);
                    const data = snapshot.val() || {};
                    const parsedPlayers = Object.entries(data)
                        .filter(([name]) => name !== "سراج")
                        .map(([name, info]) => ({
                        name,
                        points: info.totalPoints || 0
                    })).sort((a, b) => b.points - a.points);
                    setPlayers(parsedPlayers);
                }, (error) => {
                    setDbError(error.message);
                });

                const historyRef = ref(db, 'history');
                const hUnsubscribe = onValue(historyRef, (snapshot) => {
                    const data = snapshot.val() || {};
                    const parsedHistory = Object.entries(data).map(([id, info]) => ({
                        id,
                        ...info
                    })).sort((a, b) => b.timestamp - a.timestamp);
                    setHistoryLogs(parsedHistory);
                });

                const settingsRef = ref(db, 'settings/passwordsEnabled');
                const sUnsubscribe = onValue(settingsRef, (snapshot) => {
                    const val = snapshot.val();
                    setGlobalPasswordsEnabled(val === null ? true : val);
                });

                // صحبة الفجر — live-synced daily log data (separate from players/history)
                const sabhaRef = ref(db, 'sabha_fajr');
                const sabUnsubscribe = onValue(sabhaRef, (snapshot) => {
                    const data = snapshot.val() || {};
                    if (data["سراج"]) delete data["سراج"]; // never surface the test user
                    setSabhaData(data);
                });

                return () => { unsubscribe(); hUnsubscribe(); sUnsubscribe(); sabUnsubscribe(); };
            }, [db]);

            // Reset scroll to top when changing "pages" (user/admin login/logout)
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [currentUser, adminMode, showPasswordPrompt]);

            // Member password system
            const selectUser = async (name) => {
                if (!globalPasswordsEnabled) {
                    finishMemberLogin(name);
                    return;
                }
                
                setIsMemberPasswordLoading(true);
                setPendingUser(name);
                try {
                    // Always read fresh from Firebase - never use cached data
                    const playerRef = ref(db, `players/${name}/password`);
                    const snap = await get(playerRef);
                    if (snap.exists() && snap.val()) {
                        setMemberPasswordMode('enter');
                    } else {
                        setMemberPasswordMode('set');
                    }
                } catch (e) {
                    setMemberPasswordMode('set');
                } finally {
                    setIsMemberPasswordLoading(false);
                    setMemberPasswordInput("");
                    setMemberPasswordError("");
                }
            };

            const finishMemberLogin = (name) => {
                // صحبة الفجر: the same password flow, but land on the daily log instead of the points page
                if (sabhaLoginIntentRef.current) {
                    sabhaLoginIntentRef.current = false;
                    setSabhaMe(name);
                    try { localStorage.setItem('sabha_me', name); } catch (e) {}
                    setShowSabhaPicker(false);
                    setSabhaLogUser(name);
                    setPendingUser(null);
                    setMemberPasswordMode(null);
                    setMemberPasswordInput("");
                    setMemberPasswordError("");
                    return;
                }
                setCurrentUser(name);
                localStorage.setItem("mdwnh_user", name);
                setPendingUser(null);
                setMemberPasswordMode(null);
                setMemberPasswordInput("");
                setMemberPasswordError("");
            };

            const handleMemberPassword = async (e) => {
                e.preventDefault();
                if (!memberPasswordInput.trim()) return;
                setIsMemberPasswordLoading(true);
                try {
                    // Always read fresh - ensures manual Firebase changes work immediately
                    const playerRef = ref(db, `players/${pendingUser}/password`);
                    if (memberPasswordMode === 'set') {
                        await set(playerRef, memberPasswordInput.trim());
                        finishMemberLogin(pendingUser);
                    } else {
                        const snap = await get(playerRef);
                        const storedPw = snap.val();
                        if (storedPw && storedPw === memberPasswordInput.trim()) {
                            finishMemberLogin(pendingUser);
                        } else {
                            setMemberPasswordError("كلمة المرور غير صحيحة. حاول مرة أخرى.");
                        }
                    }
                } catch (err) {
                    setMemberPasswordError("حدث خطأ. حاول مرة أخرى.");
                } finally {
                    setIsMemberPasswordLoading(false);
                }
            };

            const showToast = (message) => {
                setToast({ message, visible: true });
                setTimeout(() => {
                    setToast(prev => prev ? { ...prev, visible: false } : null);
                    setTimeout(() => setToast(null), 400);
                }, 3000);
            };

            const toggleHistorySetting = (key) => {
                setHistorySettings(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const togglePasswordsEnabled = async () => {
                const newVal = !globalPasswordsEnabled;
                setGlobalPasswordsEnabled(newVal); // Optimistic update
                if (adminMode) {
                    try {
                        const settingsRef = ref(db, 'settings/passwordsEnabled');
                        await set(settingsRef, newVal);
                    } catch (e) {
                        console.error("Failed to sync password settings:", e);
                        setGlobalPasswordsEnabled(!newVal); // Revert on fail
                    }
                }
            };

            const logout = () => {
                setCurrentUser(null);
                setAdminMode(false);
                setTargetUser(null);
                localStorage.removeItem("mdwnh_user");
            };

            const getFirstName = (name) => {
                if (name === "أبو بندر") return "أبو بندر";
                return name.split(' ')[0];
            };

            const attemptAdminLogin = (e) => {
                e.preventDefault();
                if (passwordInput === "144noon") {
                    setAdminMode(true);
                    setShowPasswordPrompt(false);
                    setPasswordInput("");
                } else {
                    alert("كلمة المرور غير صحيحة!");
                }
            };

            const triggerCelebration = (person, points, silent = false) => {
                if (!silent) playPointAudio(points);
                setIsPageSuckingIn(true);
                setTimeout(() => {
                    setCelebration({ user: person, points: 30 });
                    setIsCelebrationClosing(false);
                    triggerConfetti(30);
                    setIsPageSuckingIn(false);
                    setTimeout(() => {
                        const newSparkles = [...Array(30)].map(() => {
                            let top, left;
                            do {
                                top = Math.random() * 100;
                                left = Math.random() * 100;
                            } while (Math.sqrt(Math.pow(top - 50, 2) + Math.pow(left - 50, 2)) < 30);
                            return { top, left, delay: Math.random() * 0.5, speed: 2.5 + Math.random() * 2 };
                        });
                        setSparklePositions(newSparkles);
                        setShowSparkles(true);
                    }, 2000);
                    setTimeout(() => setIsCelebrationClosing(true), 5200);
                    setTimeout(() => { setCelebration(null); setShowSparkles(false); }, 6000);
                }, 700);
            };

            const performAddPoints = async (amount, person, options = {}) => {
                const { silent = false, noToast = false, noConfetti = false, skipCelebrationSound = false } = options;
                setIsAddingPoints(true);
                setAddingPointsLabel(amount);

                let amountNum = 0;
                try {
                    amountNum = parseInt(arabicToLatin(amount)) || 0;
                    if (!silent) await new Promise(resolve => setTimeout(resolve, 300));

                    const playerRef = ref(db, `players/${person}`);
                    const snapshot = await get(playerRef);
                    const currentData = snapshot.val() || { totalPoints: 0 };

                    await set(playerRef, {
                        ...currentData,
                        totalPoints: (currentData.totalPoints || 0) + amountNum,
                        lastUpdated: serverTimestamp()
                    });

                    // Skip history logs for سراج
                    if (person !== "سراج") {
                        const historyDbRef = ref(db, 'history');
                        await push(historyDbRef, {
                            user: person,
                            amount: amountNum,
                            note: options.note || achievementNote || (options.isWheel ? (options.isPunishment ? "دائرة العقاب" : "دائرة المكافأة") : ""),
                            timestamp: Date.now(),
                            isWheel: options.isWheel || false,
                            isPunishment: options.isPunishment || false
                        });
                    }

                    const shouldConfetti = !silent && !noConfetti;

                    if (!silent && !adminMode && amountNum === 30) {
                        triggerCelebration(person, 30, skipCelebrationSound);
                    } else if (shouldConfetti) {
                        if (!silent) playPointAudio(amountNum);
                        triggerConfetti(amountNum);
                    }

                    if (amountNum === 30 && silent) {
                        triggerCelebration(person, 30, true);
                    } else if (silent && amountNum < 30 && !noConfetti) {
                        triggerConfetti(amountNum);
                    }

                    if (amountNum !== 30) {
                        setPointsPopAnim(true);
                        setTimeout(() => setPointsPopAnim(false), 700);
                    }

                    if (!noToast && amountNum !== 30) {
                        showToast("شكرًا على عملكم المتقن!");
                    }
                    setAchievementNote("");

                } catch (error) {
                    alert("تعذر إضافة النقاط. " + error.message);
                } finally {
                    if (amountNum === 30 && !silent) await new Promise(resolve => setTimeout(resolve, 3000));
                    setIsAddingPoints(false);
                    setAddingPointsLabel(null);
                }
            };

            const spinWheel = async (type) => {
                if (wheelSpinning || isAudioLoading) return;

                const result = type === 'PUNISHMENT'
                    ? PUNISHMENTS[Math.floor(Math.random() * PUNISHMENTS.length)]
                    : REWARDS[Math.floor(Math.random() * REWARDS.length)];

                // Pre-load audio
                setIsAudioLoading(true);
                const soundFile = type === 'PUNISHMENT' ? './sounds/العقاب.mp3?v=3' : (result === 30 ? './sounds/المكافأة_كبيرة.mp3?v=3' : './sounds/المكافأة.mp3?v=3');

                try {
                    const audio = new Audio(soundFile);
                    await new Promise((resolve, reject) => {
                        audio.oncanplaythrough = resolve;
                        audio.onerror = reject;
                        // Timeout after 3 seconds if audio fails to load to not block interaction
                        setTimeout(resolve, 3000);
                    });

                    wheelAudioRef.current = audio;
                    setIsAudioLoading(false);

                    setWheelResult(result);
                    setWheelSpinning(true);
                    setShowWheelResultOverlay(false);

                    const items = type === 'PUNISHMENT' ? PUNISHMENTS : REWARDS;
                    const resultIndex = items.indexOf(result);
                    const segmentAngle = 360 / items.length;
                    const extraSpins = 12;

                    const currentRotationMod = wheelRotation % 360;
                    const labelPosFromZero = (resultIndex * segmentAngle) + (segmentAngle / 2);
                    const deltaRotation = (360 - (labelPosFromZero + currentRotationMod) % 360 + 360) % 360;
                    const finalRotation = wheelRotation + deltaRotation + (extraSpins * 360);

                    setWheelRotation(finalRotation);
                    audio.play().catch(e => console.log("Audio play failed", e));

                    // IF Result is 30, we trigger celebration at 8.5 seconds for perfect sync
                    if (type === 'REWARD' && result === 30) {
                        setTimeout(() => {
                            performAddPoints("30", currentUser, { silent: true, isWheel: true });
                        }, 8500);
                    }

                    setTimeout(() => {
                        setWheelSpinning(false);
                        if (type === 'PUNISHMENT') {
                            performAddPoints("0", currentUser, {
                                silent: true,
                                isWheel: true,
                                isPunishment: true,
                                noConfetti: true,
                                noToast: true,
                                note: result
                            });
                            setShowWheelResultOverlay(true);

                            } else {
                                // For +30, showing the result popup before the celebration animation fades out

                                    setShowWheelResultOverlay(true);
                                }, 3000);
                            }
                        } else {
                            setShowWheelResultOverlay(true);

            const addPoints = (amount) => {

                if (!person) return;
                
                if (amount === 60) {
                    setIsAddingPoints(true);
                    setAddingPointsLabel(60);
                    
                    // Preload all assets needed for the +60 animation
                    const preloadAssets = async () => {
                        const assets = [
                            { type: 'audio', src: './sounds/5.mp3?v=3' },
                            { type: 'image', src: './Crown.png' },
                            { type: 'image', src: './Background.png' },
                            { type: 'image', src: './GoldCrown.png' }
                        ];

                        const promises = assets.map(asset => {
                            return new Promise((resolve) => {
                                if (asset.type === 'audio') {
                                    const audio = new Audio(asset.src);
                                    audio.oncanplaythrough = () => resolve(audio);
                                    audio.onerror = () => resolve(null);
                                    // Timeout for audio loading
                                    setTimeout(() => resolve(audio), 5000);
                                } else {
                                    const img = new Image();
                                    img.onload = () => resolve(img);
                                    img.onerror = () => resolve(null);
                                    img.src = asset.src;
                                }
                            });
                        });

                        // Wait for all assets OR a global timeout of 8 seconds, PLUS a mandatory minimum wait of 300ms
                        const minWaitPromise = new Promise(resolve => setTimeout(resolve, 300));
                        const assetLoadPromise = Promise.race([
                            Promise.all(promises),
                            new Promise(resolve => setTimeout(() => resolve([]), 8000))
                        ]);

                        const [results] = await Promise.all([assetLoadPromise, minWaitPromise]);
                        const audioAsset = results.find(a => a instanceof Audio) || new Audio('./sounds/5.mp3?v=3');
                        return audioAsset;
                    };

                    preloadAssets().then((audio) => {
                        setSpecial60({ isActive: true, phase: 'loading', showContinue: false, showAvatarCrown: false, cameraShake: false, user: person });
                        
                        // Add points immediately
                        const add60PointsToDb = async () => {
                            try {
                                const playerRef = ref(db, `players/${person}`);
                                const snapshot = await get(playerRef);
                                const currentData = snapshot.val() || { totalPoints: 0 };

                                    ...currentData,
                                    totalPoints: (currentData.totalPoints || 0) + 60,
                                    lastUpdated: serverTimestamp()
                                });

                                // Skip history logs for سراج

                                    await push(historyDbRef, {
                                        user: person,
                                        amount: 60,
                                        note: achievementNote || "",
                                        timestamp: Date.now(),
                                        isWheel: false,
                                        isPunishment: false
                                    });
                                }
                                setAchievementNote("");
                            } catch (error) {
                                console.error("Failed to add 60 points", error);
                            }
                        };
                        add60PointsToDb();

                        audio.volume = 0.5;
                        
                        const startAnimation = () => {
                            audio.play().catch(e => console.log("Audio play error", e));
                        };
                        
                        audio.onplay = () => {

                            setTimeout(() => setSpecial60(prev => ({ ...prev, phase: 'crown' })), 3500);

                                        <button
                                            onClick={() => { const n = sabhaAlreadyLoggedWarning.name; setSabhaAlreadyLoggedWarning(null); sabhaLoginIntentRef.current = true; selectUser(n); }}
                                            style={{ flex: 1, background: 'var(--sabha-blue-deep)', color: '#fff', border: 'none', borderRadius: 14, padding: '11px 14px', fontFamily: 'Rubik', fontWeight: 700, fontSize: '0.9rem', cursor: 'pointer' }}
                                        >متابعة التسجيل</button>
                                    )}
                                    <button
                                        onClick={() => setSabhaAlreadyLoggedWarning(null)}
                                        style={{ flex: 1, background: 'rgba(255,255,255,0.07)', color: 'rgba(250,249,247,0.75)', border: 'none', borderRadius: 14, padding: '11px 14px', fontFamily: 'Rubik', fontWeight: 700, fontSize: '0.9rem', cursor: 'pointer' }}
                                    >رجوع</button>
                                </div>
                                <button
                                    onClick={() => { setSabhaAlreadyLoggedWarning(null); setSabhaMe(null); try { localStorage.removeItem('sabha_me'); } catch(e) {} setShowSabhaPicker(true); }}
                                    style={{ marginTop: 16, background: 'none', border: 'none', color: 'rgba(250,249,247,0.3)', fontFamily: 'Rubik', fontSize: '0.75rem', cursor: 'pointer', textDecoration: 'underline', textUnderlineOffset: 3 }}
                                >لست {sabhaAlreadyLoggedWarning.name}؟</button>
                            </div>
                        </div>
                    )}

                    {/* Daily log screen */}
                    {sabhaLogUser && (
                        <SabhaLogScreen
                            user={sabhaLogUser}
                            entries={sabhaData[sabhaLogUser] || {}}
                            db={db}
                            onClose={() => setSabhaLogUser(null)}
                            onLogged={() => { setSabhaLogUser(null); showToast("تم التسجيل بنجاح ✓"); }}
                            onComplete={(u) => { setSabhaLogUser(null); setSabhaComplete({ user: u }); }}
                        />
                    )}

                    {/* 4/4 completion popup */}
                    {sabhaComplete && (
                        <SabhaCompletionPopup user={sabhaComplete.user} onClose={() => setSabhaComplete(null)} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
